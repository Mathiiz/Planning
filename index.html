<script>
// Anti-cache : Notion (et les CDN intermédiaires) peuvent conserver une ancienne version de
// cette page tant que son URL ne change pas. On force ici un rechargement avec un paramètre
// de version unique à chaque ouverture, ce qui déclenche systématiquement un nouveau
// téléchargement de la dernière version poussée sur GitHub plutôt qu'une copie en cache.
(function(){
  try{
    var url = new URL(window.location.href);
    if(!url.searchParams.has('v')){
      url.searchParams.set('v', Date.now());
      window.location.replace(url.toString());
    }
  }catch(e){ /* URL non standard (ex: file://) : on ignore, pas de cache distant concerné */ }
})();
</script>

<style>
  :root{
    --ink:#16233D; --ink-soft:#3E4A63; --paper:#ECEAE2; --paper-raised:#F5F3EC;
    --navy:#101B30; --accent:#0E7C7B; --accent-dark:#0A5F5E; --amber:#B8720A;
    --rule:#D3CFC0; --rule-soft:#E2DFD3; --white:#FFFEFB; --danger:#A6453A;
    --radius:3px;
    --serif:"Iowan Old Style","Palatino Linotype","Sitka Text",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    --c-psy:#0E7C7B; --c-ger:#B8720A; --c-mi:#7A5C8E; --c-ped:#3B6FA0; --c-onco:#A6453A; --c-hemato:#8A6D1E; --c-other:#6B7280;
  }
  body.dark{
    --ink:#E8E6DD; --ink-soft:#AAB4C4; --paper:#0F1420; --paper-raised:#161D2C;
    --navy:#080C14; --rule:#2A3242; --rule-soft:#212838; --white:#1A2233; --danger:#D3695C;
    --accent:#1FA6A3; --accent-dark:#3FC1BE; --amber:#D69433;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .15s,color .15s;}
  ::selection{background:var(--accent);color:var(--white);}
  a{color:var(--accent-dark);}

  .chart-header{background:var(--navy);color:#fff;padding:18px 20px 14px;position:sticky;top:0;z-index:20;}
  .chart-header .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9FB3C8;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;}
  .theme-btn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;font-size:10px;padding:3px 9px;cursor:pointer;font-family:var(--mono);}
  .chart-header h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 12px;letter-spacing:.01em;color:#fff;}
  .vitals{display:flex;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);flex-wrap:wrap;}
  .vital{flex:1 1 100px;padding:9px 12px;border-right:1px solid rgba(255,255,255,.14);}
  .vital:last-child{border-right:none;}
  .vital .num{font-family:var(--mono);font-size:18px;font-weight:600;color:#fff;line-height:1.1;}
  .vital .lbl{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#8DA0B6;margin-top:3px;}

  .tabbar{display:flex;background:var(--paper-raised);border-bottom:1px solid var(--rule);position:sticky;top:92px;z-index:19;overflow-x:auto;}
  .tabbar button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:12px 13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;position:relative;}
  .tabbar button.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
  .tabbar button .badge{position:absolute;top:6px;right:2px;background:var(--danger);color:#fff;font-size:9px;font-family:var(--mono);border-radius:8px;padding:0 4px;line-height:1.4;}

  .wrap{max-width:740px;margin:0 auto;padding:18px 16px 80px;}

  .week-summary{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;}
  .week-summary .wtitle{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 8px;}
  .week-summary .wrow{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--rule-soft);}
  .week-summary .wrow:last-child{border-bottom:none;}
  .week-summary .wval{font-family:var(--mono);font-weight:600;}
  .wval.ok{color:var(--accent-dark);}
  .wval.warn{color:var(--danger);}

  .day-head{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;}
  .day-head .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .day-head .phase-lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 4px;}
  .day-head h2{font-family:var(--serif);font-size:18px;margin:0 0 2px;font-weight:600;text-transform:capitalize;}
  .day-head .sub{font-size:12px;color:var(--ink-soft);}
  .report-btn{margin-top:10px;font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:20px;padding:5px 12px;cursor:pointer;}
  .report-control{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .report-control select, .report-control input[type=text]{font-family:var(--sans);font-size:12px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-raised);color:var(--ink);}
  .report-control input[type=text]{flex:1;min-width:120px;}
  .report-control .report-btn{margin-top:0;}
  .report-btn.active{background:var(--amber);color:#fff;border-color:var(--amber);}

  .task-card{background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .task-card.revision{border-left-color:var(--accent);}
  .task-card.entrainement{border-left-color:var(--amber);}
  .task-card.sdd{border-left-color:var(--danger);}
  .task-card .top-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
  .mode-badge{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:2px;color:#fff;}
  .mode-badge.revision{background:var(--accent);}
  .mode-badge.entrainement{background:var(--amber);}
  .cat-pill{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:2px;color:#fff;opacity:.85;}
  .item-num{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .hist-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-left:auto;}
  .task-card h3{font-family:var(--serif);font-size:15.5px;margin:0 0 6px;font-weight:600;line-height:1.35;}
  .task-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .task-check{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .task-check input[type=checkbox]{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--white);flex-shrink:0;}
  .task-check input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .task-check input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .task-check span{font-size:13px;font-weight:600;}
  .task-card.done{opacity:.6;}
  .task-card.done h3{text-decoration:line-through;}

  .generic-list{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);overflow:hidden;}
  .generic-list li{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule-soft);font-size:13.5px;}
  .generic-list li:last-child{border-bottom:none;}
  .generic-list input[type=checkbox]{appearance:none;width:17px;height:17px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--white);flex-shrink:0;}
  .generic-list input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .generic-list input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .generic-list li.done label{text-decoration:line-through;color:#8B8A80;}
  .generic-list label{cursor:pointer;flex:1;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state h2{font-family:var(--serif);color:var(--ink);}

  .plan-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--rule);border-radius:var(--radius);margin-bottom:5px;cursor:pointer;font-size:12.5px;}
  .plan-row:hover{border-color:var(--accent);}
  .plan-row .pd{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);width:74px;flex-shrink:0;text-transform:capitalize;}
  .plan-row .pitems{flex:1;display:flex;gap:5px;flex-wrap:wrap;}
  .plan-row .pitem{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:2px;color:#fff;}
  .month-divider{font-family:var(--serif);font-size:15px;font-weight:600;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);}
  .weekend-note{font-size:11.5px;color:var(--ink-soft);background:var(--paper-raised);border:1px dashed var(--rule);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}

  .spec-card{background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:13px 16px;margin-bottom:8px;cursor:pointer;}
  .spec-card .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
  .spec-card .name{font-weight:600;font-size:13px;}
  .spec-card .pct{font-family:var(--mono);font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .dualbar{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;display:flex;}
  .dualbar .seg-rev{height:100%;background:var(--accent);}
  .dualbar .seg-ent{height:100%;background:var(--amber);}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:600;margin:22px 0 10px;}

  .item-list{list-style:none;margin:0;padding:0;}
  .item-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);margin-bottom:5px;font-size:12.5px;cursor:pointer;}
  .item-row .inum{font-family:var(--mono);color:var(--ink-soft);width:32px;flex-shrink:0;}
  .item-row .ititle{flex:1;}
  .item-row .icount{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);}

  .history-panel{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;}
  .history-panel h3{font-family:var(--serif);font-size:16px;margin:0 0 4px;}
  .history-panel .hcat{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;display:inline-block;padding:2px 7px;border-radius:2px;margin-bottom:10px;}
  .hist-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px;}
  .hist-entry:last-child{border-bottom:none;}
  .hist-entry .hdate{font-family:var(--mono);color:var(--ink-soft);}
  .hist-mode{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:2px;color:#fff;}
  .hist-mode.revision{background:var(--accent);}
  .hist-mode.entrainement{background:var(--amber);}
  .hist-mode.pending{background:var(--rule);color:var(--ink-soft);}
  .hist-empty{color:var(--ink-soft);font-size:12.5px;padding:10px 0;}

  .lca-streak{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:18px;}
  .lca-streak .n{font-family:var(--mono);font-size:32px;font-weight:700;}
  .lca-streak .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9FB3C8;margin-top:2px;}
  .lca-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);margin-bottom:6px;font-size:13px;}
  .lca-row.done{border-left:3px solid var(--accent);}

  .retard-row{background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--danger);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;}
  .retard-row .rtop{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap;}
  .retard-row .rdate{font-family:var(--mono);font-size:10.5px;color:var(--danger);}
  .retard-row h4{font-family:var(--serif);font-size:14px;margin:0 0 8px;font-weight:600;}
  .retard-row .rcheck{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .retard-row .rcheck input{appearance:none;width:17px;height:17px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--white);flex-shrink:0;}
  .retard-row .rcheck input:checked{background:var(--accent);border-color:var(--accent);}
  .retard-row .rcheck input:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .retard-row .rcheck span{font-size:12.5px;font-weight:600;}

  footer.note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:26px;line-height:1.6;}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:13px;}
  .back-link{color:var(--accent-dark);background:none;border:none;font-family:var(--mono);font-size:11.5px;cursor:pointer;margin-bottom:14px;text-decoration:underline;padding:0;}

  .cat-checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 10px;margin-bottom:4px;}

<div class="onboard-overlay hidden" id="onboardOverlay">

    <h2>Bienvenue 👋</h2>
    <p class="lead">Quelques informations pour construire ton planning personnalisé. Tu pourras tout modifier plus tard dans l'onglet Paramètres.</p>
    <label>Année d'étude actuelle
      <select id="obStudentYear">
        <option value="3">3ᵉ année (DFGSM3)</option>
        <option value="4">4ᵉ année (DFASM1)</option>
        <option value="5">5ᵉ année (DFASM2)</option>
        <option value="6" selected>6ᵉ année (DFASM3 — EDN)</option>
      </select>
    </label>
    <label>Début des révisions<input type="date" id="obStart"></label>
    <label>Date de l'examen final (partiels ou EDN)<input type="date" id="obExam"></label>

      <input type="date" id="obS1End">
      <span class="hint">Date à partir de laquelle tu révises tout le programme cumulativement. Si cela ne te concerne pas encore (ex: organisation en trimestres/semestres), choisis une date proche de ton examen final.</span>
    </label>
    <label>Mode d'enchaînement des matières
      <select id="obStudyMode">
        <option value="alterne" selected>Alterné (mélanger les matières au jour le jour)</option>
        <option value="bloc">En bloc (terminer une matière avant de passer à la suivante)</option>
      </select>
      <span class="hint">Tu pourras le modifier n'importe quand dans les paramètres.</span>
    </label>
    <label>Date des ECOS (optionnel)
      <input type="date" id="obEcos">
      <span class="hint">Active l'entraînement aux SDD entre les EDN et cette date.</span>
    </label>
    <label>Matières de la période actuelle (trimestre, semestre ou stage)

  </div>
</div>

function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function parseISO(s){
  if(!s) return new Date(NaN);
  const parts = s.split('-').map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtShort(d){ return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
function fmtLong(d){ return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }
function fmtMonthYear(d){ const s=d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function isWeekendDate(d){ const dow=d.getDay(); return dow===0||dow===6; }
function todayDate(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function todayIso(){ return toISO(todayDate()); }

function categoriesByDeadlinePriority(cats){
  const dl = (DATA && DATA.subjectDeadlines) || {};
  const withDL = cats.filter(c=>dl[c]).sort((a,b)=> dl[a] < dl[b] ? -1 : (dl[a] > dl[b] ? 1 : 0));
  const withoutDL = cats.filter(c=>!dl[c]);
  return {withDL, withoutDL};
}

  const y = DATA && DATA.config && DATA.config.studentYear;
  return y || 6;
}
let ITEM_BY_NUM = {};
let CURRENT_ITEMS = [];

function normalizeCats(c){ return Array.isArray(c) ? c.slice() : [c || 'other']; }
function itemsOfCat(cat){ return CURRENT_ITEMS.filter(([n,t,cats])=> normalizeCats(cats).includes(cat)).map(([n])=>n); }
function itemsOfPrimaryCat(cat){ return CURRENT_ITEMS.filter(([n,t,cats])=> normalizeCats(cats)[0]===cat).map(([n])=>n); }

function roundRobin(lists){
  const out = []; let idx=0, more=true;
  while(more){ more=false; for(const l of lists){ if(idx<l.length){ out.push(l[idx]); more=true; } } idx++; }
  return out;
}
let S1_QUEUE = [];
let S2_QUEUE = [];
let SDD_QUEUE = [];
let SDD_BY_NUM = {};
const SDD_PER_DAY = 4;

function itemsPerDayFor(phase){
  const cfg = (DATA && DATA.config) || {};
  if(phase==='S1') return parseInt(cfg.dailyItemsPhase1, 10) || 2;
  if(phase==='S2') return parseInt(cfg.dailyItemsPhase2, 10) || 3;
  return 2;
}

function rebuildAll(){
  DATA.items = DATA.items.map(([n,t,c])=>[n,t,normalizeCats(c)]);
  CURRENT_ITEMS = DATA.items;
  ITEM_BY_NUM = {};
  CURRENT_ITEMS.forEach(([n,t,cats])=>{ ITEM_BY_NUM[n] = {num:n, title:t, cats:cats, cat: cats[0]}; });
  S1_QUEUE = buildS1Queue();
  S2_QUEUE = buildS2Queue();
  const sdd = DATA.sddItems || [];
  SDD_QUEUE = sdd.map(([n])=>n);
  SDD_BY_NUM = {};
  sdd.forEach(([n,t])=>{ SDD_BY_NUM[n] = {num:n, title:t}; });
  updateTitles();
}

function updateTitles(){
  if(DATA && DATA.config && DATA.config.exam){

function sddTaskForIndex(idx){
  if(SDD_QUEUE.length===0) return null;
  const pos = idx % SDD_QUEUE.length;
  const occurrence = Math.floor(idx/SDD_QUEUE.length)+1;
  const num = SDD_QUEUE[pos];
  return { key:'ECOS_i'+num+'_o'+occurrence, num, occurrence };
}

function buildS1Queue(){
  const cats = currentNewCats();
  const mode = (DATA && DATA.config && DATA.config.studyModeP1) || 'alterne';
  if(cats.length===0){
    return CURRENT_ITEMS.map(([n])=>n);
  }
  const {withDL, withoutDL} = categoriesByDeadlinePriority(cats);
  let urgent = [];
  if(mode === 'bloc'){
    withDL.forEach(c=>{ itemsOfPrimaryCat(c).forEach(n=>urgent.push(n)); });
  } else {
    urgent = roundRobin(withDL.map(itemsOfPrimaryCat));
  }

  let rest = [];
  if(mode === 'bloc'){
    withoutDL.forEach(c => {
      itemsOfPrimaryCat(c).forEach(n => rest.push(n));
    });
  } else {
    rest = roundRobin(withoutDL.map(itemsOfPrimaryCat));
  }
  return urgent.concat(rest);
}

function buildS2Queue(){
  const mode = (DATA && DATA.config && DATA.config.studyModeP2) || 'alterne';
  const {withDL} = categoriesByDeadlinePriority(ALL_CATS);
  const seen = new Set();
  let urgent = [];
  if(mode === 'bloc'){
    withDL.forEach(c=>{
      itemsOfCat(c).forEach(n=>{ if(!seen.has(n)){ urgent.push(n); seen.add(n); } });
    });
  } else {
    roundRobin(withDL.map(c=>itemsOfCat(c))).forEach(n=>{
      if(!seen.has(n)){ urgent.push(n); seen.add(n); }
    });
  }
  const restNums = CURRENT_ITEMS.map(([n])=>n).filter(n=>!seen.has(n));

  let rest = [];
  if(mode === 'bloc'){
    const withDLSet = new Set(withDL);
    const withoutDLCats = ALL_CATS.filter(c => !withDLSet.has(c));
    withoutDLCats.forEach(c => {
      itemsOfCat(c).forEach(n => {
        if(!seen.has(n) && !rest.includes(n)){
          rest.push(n);
        }
      });
    });
    restNums.forEach(n => {
      if(!rest.includes(n)) rest.push(n);
    });
  } else {
    const byCat = {};
    restNums.forEach(n=>{
      const it = ITEM_BY_NUM[n];
      const cat = (it && it.cats && it.cats[0]) || '_sans_matiere';
      if(!byCat[cat]) byCat[cat] = [];
      byCat[cat].push(n);
    });
    rest = roundRobin(Object.values(byCat));
  }
  return urgent.concat(rest);
}

function taskForIndex(phase, idx){
  const queue = phase==='S1' ? S1_QUEUE : S2_QUEUE;
  if(queue.length===0) return { key: phase+'_empty_'+idx, itemNum:null, mode:'revision', occurrence:1 };
  const pos = idx % queue.length;
  const occurrence = Math.floor(idx/queue.length)+1;
  const mode = occurrence===1 ? 'revision' : 'entrainement';
  const itemNum = queue[pos];
  return { key: phase+'_i'+itemNum+'_o'+occurrence, itemNum, mode, occurrence };
}

let DATA = null;
let CAL = [];
let INDEX_DATE = {S1:{}, S2:{}};
let PHASE_FINAL_QUOTA = {S1:0, S2:0, ECOS:0};
let currentTab = 'today';
let selectedDayIso = null;
let selectedItemNum = null;

function buildCalendar(cfg, reportedDays){
  reportedDays = reportedDays || {};
  if(!cfg || !cfg.start || !cfg.exam) return [];
  const start = parseISO(cfg.start);
  const s1End = cfg.s1End ? parseISO(cfg.s1End) : addDays(start, 150);
  const exam = parseISO(cfg.exam);
  if(isNaN(start.getTime()) || isNaN(exam.getTime()) || start > exam) return [];

  const consolStart = addDays(exam,-21);
  const ecosDate = cfg.ecosDate ? parseISO(cfg.ecosDate) : null;
  const finalDate = (ecosDate && !isNaN(ecosDate.getTime()) && ecosDate > exam) ? ecosDate : exam;
  const days = [];
  INDEX_DATE = {S1:{}, S2:{}};
  let counters = {S1:0, S2:0, ECOS:0};
  let cur = new Date(start);
  while(cur <= finalDate){
    const weekend = isWeekendDate(cur);
    let phase;
    if(cur > exam) phase='ECOS';
    else if(cur >= consolStart) phase='CONSOL';
    else if(cur < s1End) phase='S1';
    else phase='S2';

    const iso = toISO(cur);
    const reportedEntry = reportedDays[iso] || null;
    const reported = !!reportedEntry;
    const day = { date:new Date(cur), iso, phase, weekend, reported, reportedInfo: reportedEntry };

    if(phase==='ECOS'){
      day.tasks = [];
      if(!reported && SDD_QUEUE.length>0){
        const baseIdx = counters.ECOS*SDD_PER_DAY;
        for(let i=0;i<SDD_PER_DAY;i++){
          const idx = baseIdx+i;
          const t = sddTaskForIndex(idx);
          if(t) day.tasks.push({id:t.key, kind:'sdd', num:t.num, idx});
        }
        counters.ECOS++;
      }
    } else if(!weekend && (phase==='S1'||phase==='S2') && !reported && (phase==='S1'?S1_QUEUE.length:S2_QUEUE.length)>0){
      const perDay = itemsPerDayFor(phase);
      const baseIdx = counters[phase]*perDay;
      day.tasks = [];
      for(let i=0;i<perDay;i++){
        const idx = baseIdx+i;
        const e = effectiveItemFor(phase, idx);
        INDEX_DATE[phase][idx] = iso;
        day.tasks.push({id:e.nativeKey, kind:'item', itemNum:e.itemNum, mode:e.mode, idx, phase, overridden:e.overridden, originalItemNum:e.originalItemNum});
      }
      counters[phase]++;
    } else if(!weekend && (phase==='S1'||phase==='S2')){
      day.tasks = [];
    } else if(weekend){
      day.tasks = [];
      if(!reported){
        if(currentStudentYear() >= 5){
          day.tasks.push({id:'lca', kind:'generic', label:"LCA — 2 articles minimum (méthodologie + analyse critique)"});
        }
        day.tasks.push({id:'free', kind:'generic', label:"Révision libre — item ou matière de ton choix (rattrapage)"});
      }
    } else { // CONSOL
      day.tasks = reported ? [] : [
        {id:'anki_all', kind:'generic', label:"Anki — session complète (aucune nouvelle carte)"},
        {id:'qcm_blancs', kind:'generic', label:"QCM blancs / annales chronométrées, conditions d'examen"},
        {id:'flash', kind:'generic', label:"Relecture flash — points faibles identifiés"},
        {id:'rest', kind:'generic', label:"Repos actif — vraie coupure en fin de semaine"},
      ];
    }
    days.push(day);
    cur = addDays(cur,1);
  }
  PHASE_FINAL_QUOTA.S1 = counters.S1 * itemsPerDayFor('S1');
  PHASE_FINAL_QUOTA.S2 = counters.S2 * itemsPerDayFor('S2');
  PHASE_FINAL_QUOTA.ECOS = counters.ECOS * SDD_PER_DAY;
  return days;
}

function effectiveItemFor(phase, idx){
  const t = taskForIndex(phase, idx);
  const ov = DATA && DATA.itemOverrides && DATA.itemOverrides[t.key];
  return {
    nativeKey: t.key,
    mode: t.mode,
    itemNum: ov ? ov.itemNum : t.itemNum,
    overridden: !!ov,
    originalItemNum: t.itemNum
  };
}
function getSlot(phase, idx){
  const e = effectiveItemFor(phase, idx);
  return Object.assign({ phase, idx, iso: (INDEX_DATE[phase] && INDEX_DATE[phase][idx]) || null }, e);
}
function findSwapCandidates(itemNum){
  const out = [];
  ['S1','S2'].forEach(phase=>{
    const cap = PHASE_FINAL_QUOTA[phase] || 0;
    for(let idx=0; idx<cap; idx++){
      const s = getSlot(phase, idx);
      if(s.itemNum === itemNum) out.push(s);
    }
  });
  out.sort((a,b)=> (a.iso||'') < (b.iso||'') ? -1 : 1);
  return out;
}
function performSwap(phaseA, idxA, nativeKeyA, itemA, slotB, itemB){
  DATA.itemOverrides = DATA.itemOverrides || {};
  DATA.itemOverrides[nativeKeyA] = { itemNum: itemB };
  DATA.itemOverrides[slotB.nativeKey] = { itemNum: itemA };
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  saveData();
  render();
}
function undoSwap(nativeKey){
  if(DATA.itemOverrides) delete DATA.itemOverrides[nativeKey];
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  saveData();
  render();
}

function deadlineAlertsHTML(){
  const dl = DATA.subjectDeadlines || {};
  const cats = Object.keys(dl);
  if(cats.length===0) return '';
  const itemStatus = computeItemStatus();
  const status = {};
  Object.keys(itemStatus).forEach(n=>{ status[n] = itemStatus[n].revision; });
  const today = todayDate();
  const rows = cats.map(c=>{
    const daysLeft = daysBetween(today, parseISO(dl[c]));
    const nums = itemsOfCat(c);
    const total = nums.length;
    const done = nums.filter(n=>status[n]).length;
    return { cat:c, daysLeft, total, done, remaining: total-done };
  }).filter(r=>r.daysLeft >= -1).sort((a,b)=>a.daysLeft-b.daysLeft);
  if(rows.length===0) return '';
  return `<div class="dl-alerts">` + rows.map(r=>{
    const urgent = r.daysLeft <= 7;
    const label = r.daysLeft < 0 ? 'DL dépassée' : (r.daysLeft===0 ? 'DL aujourd\u2019hui' : `DL dans ${r.daysLeft} j`);
    const statusLabel = r.remaining>0 ? `${r.done}/${r.total} vus · ${r.remaining} restants` : `${r.total}/${r.total} vus — tout vu ✓`;
    return `<div class="dl-alert-row ${urgent?'urgent':''}">
      <span class="dl-cat">${CAT_LABELS[r.cat]||r.cat}</span>
      <span class="dl-detail">${label} · ${statusLabel}</span>

  }).join('') + `</div>`;
}

      if(targetNum === curItemNum){ resultsEl.innerHTML = `<p class="hist-empty">C'est déjà l'item affiché ici.</p>`; return; }
      if(!phase || isNaN(idx)){ resultsEl.innerHTML = `<p class="hist-empty">Échange indisponible pour cette case.</p>`; return; }
      const candidates = findSwapCandidates(targetNum).filter(c=> !(c.phase===phase && c.idx===idx));
      if(candidates.length===0){ resultsEl.innerHTML = `<p class="hist-empty">Aucune occurrence planifiée pour #${targetNum} — ${esc(ITEM_BY_NUM[targetNum].title)}.</p>`; return; }

      resultsEl.querySelectorAll('[data-swapchoice]').forEach(row=>{
        row.addEventListener('click', ()=>{

          performSwap(phase, idx, key, curItemNum, candidates[i], targetNum);
        });
      });
    });
  });
}

// ---------- fichier de secours (File System Access API) ----------
const IDB_NAME = 'edn-planner-fs', IDB_STORE = 'handles', IDB_KEY = 'backupFile';
function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSetHandle(handle){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGetHandle(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const r = tx.objectStore(IDB_STORE).get(IDB_KEY);
    r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
  });
}
let backupHandle = null;
let currentLinkFileStatus = '';
function fsApiSupported(){ return typeof window.showSaveFilePicker === 'function'; }
function setLinkStatus(text){
  currentLinkFileStatus = text;
  const el = document.getElementById('linkFileStatus');
  if(el) el.textContent = text;
}
async function linkBackupFile(){
  if(!fsApiSupported()){
    alert("Ton navigateur ne supporte pas cette fonction. Continue avec Exporter/Importer manuellement, ou utilise Chrome/Arc/Edge à jour.");
    return;
  }
  try{
    let handle;
    try{
      handle = await window.showSaveFilePicker({
        suggestedName: 'edn-sauvegarde.json',
        types: [{description:'Sauvegarde EDN', accept:{'application/json':['.json']}}]
      });
    }catch(e){ return; }
    backupHandle = handle;
    await idbSetHandle(handle);
    await writeBackupFile();
    setLinkStatus('Lié : ' + handle.name);
  }catch(e){ console.error(e); alert("Impossible de lier le fichier."); }
}
async function writeBackupFile(){
  if(!backupHandle) return;
  try{
    const ok = await ensurePermission(backupHandle);
    if(!ok) return;
    const writable = await backupHandle.createWritable();
    await writable.write(JSON.stringify(DATA, null, 2));
    await writable.close();
  }catch(e){ console.error('Erreur écriture fichier de secours', e); }
}
async function ensurePermission(handle){
  const opts = {mode:'readwrite'};
  if((await handle.queryPermission(opts)) === 'granted') return true;
  if((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}
async function tryReconnectBackupFile(){
  if(!fsApiSupported()) return;
  try{
    const handle = await idbGetHandle();
    if(!handle) return;
    const ok = await ensurePermission(handle);
    if(!ok){ setLinkStatus('Fichier lié : clique pour réautoriser'); backupHandle = handle; return; }
    backupHandle = handle;
    setLinkStatus('Lié : ' + handle.name);
    const file = await handle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const parsed = JSON.parse(text);
      DATA = Object.assign({itemChecks:{}, checks:{}, reportedDays:{}, darkMode:false, itemOverrides:{}, customTasks:{}, subjectDeadlines:{}, itemDifficulty:{}, lcaEntries:{}, sddItems: SDD_SEED_RAW.map(([n,t])=>[n,t]), onboarded:true}, parsed);
      DATA.config = Object.assign(getDefaultConfig(), parsed.config || {});
      if(!DATA.items) DATA.items = ITEMS_RAW.map(([n,t,c])=>[n,t,c]);
      await saveData();
    }
  }catch(e){ console.error('Reconnexion fichier de secours impossible', e); }
}

// ---------- synchronisation GitHub ----------
const GH_CONFIG_KEY = 'edn-planner-github-v1';
const GH_SNAPSHOT_KEY = 'edn-planner-github-snapshot-v1';
let ghSaveInFlight = false;
let ghSavePending = false;
let ghSha = null;
let ghDebounceTimer = null;
let ghPendingSince = null;
const GH_DEBOUNCE_MS = 15000;
const GH_MAX_WAIT_MS = 60000;
let currentGhStatus = '';

function getGithubConfig(){
  try{
    const raw = localStorage.getItem(GH_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setGithubConfig(cfg){
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
  ghSha = null;
}
function clearGithubConfig(){
  localStorage.removeItem(GH_CONFIG_KEY);
  localStorage.removeItem(GH_SNAPSHOT_KEY);
  ghSha = null;
  if(ghDebounceTimer){ clearTimeout(ghDebounceTimer); ghDebounceTimer = null; ghPendingSince = null; }
}
function ghHeaders(cfg){
  return {
    'Authorization': 'token ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function ghContentsUrl(cfg){
  return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
}
function setGithubStatus(text){
  currentGhStatus = text;
  const el = document.getElementById('ghStatus');
  if(el) el.textContent = text;
}
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}
function getGhSnapshot(){
  try{ const raw = localStorage.getItem(GH_SNAPSHOT_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function setGhSnapshot(data){
  try{ localStorage.setItem(GH_SNAPSHOT_KEY, JSON.stringify(data)); }catch(e){}
}

function mergeMap(remote, local, snapshot){
  remote = remote || {}; local = local || {}; snapshot = snapshot || {};
  const keys = new Set([...Object.keys(remote), ...Object.keys(local), ...Object.keys(snapshot)]);
  const out = {};
  keys.forEach(k=>{
    const r = remote[k], l = local[k], s = snapshot[k];
    const localChanged = JSON.stringify(l) !== JSON.stringify(s);
    const remoteChanged = JSON.stringify(r) !== JSON.stringify(s);
    let v;
    if(localChanged) v = l;
    else if(remoteChanged) v = r;
    else v = (l!==undefined ? l : r);
    if(v!==undefined) out[k] = v;
  });
  return out;
}
function mergeScalar(remote, local, snapshot){
  const localChanged = JSON.stringify(local) !== JSON.stringify(snapshot);
  const remoteChanged = JSON.stringify(remote) !== JSON.stringify(snapshot);
  if(localChanged) return local;
  if(remoteChanged) return remote;
  return local!==undefined ? local : remote;
}
function mergeData(remote, local, snapshot){
  remote = remote || {}; snapshot = snapshot || {};
  return {
    config: mergeMap(remote.config, local.config, snapshot.config),
    items: mergeScalar(remote.items, local.items, snapshot.items),
    darkMode: mergeScalar(remote.darkMode, local.darkMode, snapshot.darkMode),
    onboarded: mergeScalar(remote.onboarded, local.onboarded, snapshot.onboarded),
    itemChecks: mergeMap(remote.itemChecks, local.itemChecks, snapshot.itemChecks),
    checks: mergeMap(remote.checks, local.checks, snapshot.checks),
    reportedDays: mergeMap(remote.reportedDays, local.reportedDays, snapshot.reportedDays),
    itemOverrides: mergeMap(remote.itemOverrides, local.itemOverrides, snapshot.itemOverrides),
    subjectDeadlines: mergeMap(remote.subjectDeadlines, local.subjectDeadlines, snapshot.subjectDeadlines),
    customTasks: mergeMap(remote.customTasks, local.customTasks, snapshot.customTasks),
    itemDifficulty: mergeMap(remote.itemDifficulty, local.itemDifficulty, snapshot.itemDifficulty),
    lcaEntries: mergeMap(remote.lcaEntries, local.lcaEntries, snapshot.lcaEntries),
    sddItems: mergeScalar(remote.sddItems, local.sddItems, snapshot.sddItems)
  };
}

async function githubLoadData(){
  const cfg = getGithubConfig();
  if(!cfg || !cfg.token || !cfg.owner || !cfg.repo) return null;
  try{
    setGithubStatus('Chargement depuis GitHub…');
    const res = await fetch(ghContentsUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch||'main'), { headers: ghHeaders(cfg) });
    if(res.status===404){ setGithubStatus('Aucune donnée distante — première sauvegarde à venir'); return null; }
    if(!res.ok){ setGithubStatus('Erreur de connexion GitHub (' + res.status + ')'); return null; }
    const j = await res.json();
    ghSha = j.sha;
    const parsed = JSON.parse(b64DecodeUtf8(j.content.replace(/\n/g,'')));
    setGhSnapshot(parsed);
    setGithubStatus('Synchronisé ✓');
    return parsed;
  }catch(e){
    console.error('Erreur GitHub (chargement)', e);
    setGithubStatus('Hors ligne — utilisation de la copie locale');
    return null;
  }
}
function scheduleGithubSync(){
  const cfg = getGithubConfig();
  if(!cfg || !cfg.token || !cfg.owner || !cfg.repo) return;
  const now = Date.now();
  if(ghPendingSince===null) ghPendingSince = now;
  if(ghDebounceTimer) clearTimeout(ghDebounceTimer);
  const waited = now - ghPendingSince;
  const delay = waited >= GH_MAX_WAIT_MS ? 0 : GH_DEBOUNCE_MS;
  setGithubStatus('Modifications en attente de synchronisation…');
  ghDebounceTimer = setTimeout(()=>{
    ghDebounceTimer = null;
    ghPendingSince = null;
    githubSyncNow();
  }, delay);
}
async function githubSyncNow(){
  const cfg = getGithubConfig();
  if(!cfg || !cfg.token || !cfg.owner || !cfg.repo) return;
  if(ghSaveInFlight){ ghSavePending = true; return; }
  ghSaveInFlight = true;
  setGithubStatus('Synchronisation…');
  try{
    for(let attempt=0; attempt<2; attempt++){
      let remoteData = null, sha;
      try{
        const r = await fetch(ghContentsUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch||'main'), { headers: ghHeaders(cfg) });
        if(r.ok){
          const j = await r.json();
          sha = j.sha;
          remoteData = JSON.parse(b64DecodeUtf8(j.content.replace(/\n/g,'')));
        } else if(r.status===404){
          sha = undefined;
        } else {
          setGithubStatus('Erreur de connexion GitHub (' + r.status + ')');
          return;
        }
      }catch(e){
        setGithubStatus('Hors ligne — sauvegardé localement seulement');
        return;
      }

      const snapshot = getGhSnapshot();
      const merged = remoteData ? mergeData(remoteData, DATA, snapshot) : DATA;

      const body = {
        message: 'Mise à jour planning — ' + new Date().toISOString(),
        content: b64EncodeUtf8(JSON.stringify(merged, null, 2)),
        branch: cfg.branch || 'main'
      };
      if(sha) body.sha = sha;
      const res = await fetch(ghContentsUrl(cfg), { method:'PUT', headers: ghHeaders(cfg), body: JSON.stringify(body) });
      if(res.ok){
        const j = await res.json();
        ghSha = j.content ? j.content.sha : null;
        DATA = merged;
        setGhSnapshot(merged);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
        rebuildAll();
        CAL = buildCalendar(DATA.config, DATA.reportedDays);
        render();
        setGithubStatus('Synchronisé ✓ ' + new Date().toLocaleTimeString('fr-FR'));
        return;
      } else if(res.status===409){
        continue;
      } else {

}

function dayChecks(iso){ if(!DATA.checks[iso]) DATA.checks[iso] = {}; return DATA.checks[iso]; }
function isItemTaskDone(key){ return !!DATA.itemChecks[key]; }
function setItemTaskDone(key, val){ DATA.itemChecks[key] = val; saveData(); }
function isGenericDone(iso, taskId){ return !!dayChecks(iso)[taskId]; }
function setGenericDone(iso, taskId, val){ dayChecks(iso)[taskId] = val; saveData(); }

function phaseColor(phase){ return phase==='S1' ? 'var(--accent)' : phase==='S2' ? 'var(--navy)' : phase==='ECOS' ? 'var(--danger)' : 'var(--amber)'; }
function phaseLabel(phase){
  return phase==='S1' ? 'Période en cours — apprentissage & découverte' : phase==='S2' ? 'Révision générale — programme complet' : phase==='ECOS' ? 'Entraînement ECOS (SDD)' : 'Consolidation finale';
}

function quotaBeforeToday(phase){
  const t = todayDate();
  if(CAL.length && t < CAL[0].date) return 0;
  if(CAL.length && t > CAL[CAL.length-1].date) return PHASE_FINAL_QUOTA[phase];
  const today = findDay(todayIso());
  if(!today) return PHASE_FINAL_QUOTA[phase];
  if(today.phase === phase){
    let n = 0;
    for(const d of CAL){
      if(d.iso === today.iso) break;
      if(!d.weekend && d.phase===phase && !d.reported) n++;
    }
    return n * itemsPerDayFor(phase);
  }
  const order = {S1:0, S2:1, CONSOL:2, ECOS:3};
  if(order[today.phase] > order[phase]) return PHASE_FINAL_QUOTA[phase];
  return 0;
}
function quotaThroughToday(phase){
  const t = todayDate();
  if(CAL.length && t < CAL[0].date) return 0;
  if(CAL.length && t > CAL[CAL.length-1].date) return PHASE_FINAL_QUOTA[phase];
  const today = findDay(todayIso());
  if(!today) return PHASE_FINAL_QUOTA[phase];
  if(today.phase === phase){
    if(today.reported) return quotaBeforeToday(phase);
    let n = 0;
    for(const d of CAL){
      if(!d.weekend && d.phase===phase && !d.reported) n++;
      if(d.iso === today.iso) break;
    }
    return n * itemsPerDayFor(phase);
  }
  const order = {S1:0, S2:1, CONSOL:2, ECOS:3};
  if(order[today.phase] > order[phase]) return PHASE_FINAL_QUOTA[phase];
  return 0;
}

function uncompletedInRange(phase, cap){
  const out = [];
  for(let idx=0; idx<cap; idx++){
    const s = getSlot(phase, idx);
    if(s && s.itemNum && !isItemTaskDone(s.nativeKey)) {
      out.push({ key:s.nativeKey, itemNum:s.itemNum, mode:s.mode, phase, idx, overridden:s.overridden, originalItemNum:s.originalItemNum });
    }
  }
  return out;
}

function todaysDynamicTasks(){
  const today = findDay(todayIso());
  if(!today || today.weekend || today.phase==='CONSOL' || today.phase==='ECOS' || today.reported) return [];
  const perDay = itemsPerDayFor(today.phase);
  const cap = quotaThroughToday(today.phase);
  const pending = uncompletedInRange(today.phase, cap);
  return pending.slice(0, perDay);
}

function retardList(){
  const out = [];
  ['S1','S2'].forEach(phase=>{
    const cap = quotaBeforeToday(phase);
    uncompletedInRange(phase, cap).forEach(t=>{
      out.push({ type:'item', phase, idx:t.idx, itemNum:t.itemNum, mode:t.mode, key:t.key, iso: INDEX_DATE[phase][t.idx] });
    });
  });

  const today = todayIso();
  const seenLcaWeekends = new Set();

  CAL.forEach(d=>{
    if(d.iso >= today) return;

    if(d.weekend){
      const dow = d.date.getDay();
      const satDate = dow === 6 ? d.date : addDays(d.date, -1);
      const satIso = toISO(satDate);
      const sunIso = toISO(addDays(satDate, 1));
      if(!seenLcaWeekends.has(satIso)){
        seenLcaWeekends.add(satIso);
        const lcaDone = isGenericDone(satIso, 'lca') || isGenericDone(sunIso, 'lca');
        if(!lcaDone && sunIso < today && currentStudentYear() >= 5){
          out.push({
            type:'generic',
            iso: satIso,
            label: "LCA du week-end (" + fmtShort(satDate) + ") — 2 articles",
            taskId: 'lca',
            isLcaWeekend: true,
            satIso: satIso,
            sunIso: sunIso
          });
        }
      }
      (d.tasks||[]).forEach(t=>{
        if(t.kind==='generic' && t.id !== 'lca' && !isGenericDone(d.iso, t.id)){
          out.push({type:'generic', iso:d.iso, label:t.label, taskId:t.id});
        }
      });
    } else if(d.phase==='CONSOL'){
      (d.tasks||[]).forEach(t=>{
        if(t.kind==='generic' && !isGenericDone(d.iso, t.id)){
          out.push({type:'generic', iso:d.iso, label:t.label, taskId:t.id});
        }
      });
    }

    const custom = (DATA.customTasks && DATA.customTasks[d.iso]) || [];
    custom.forEach(ct=>{
      if(!isGenericDone(d.iso, ct.id)){
        out.push({type:'generic', iso:d.iso, label:ct.label, taskId:ct.id});
      }
    });
  });

  out.sort((a,b)=> (a.iso||'') < (b.iso||'') ? -1 : 1);
  return out;
}

function computeItemStatus(){
  // Basé directement sur les coches enregistrées (DATA.itemChecks), pas sur la file
  // d'attente S1/S2 actuelle : une matière retirée ou ajoutée aux « matières de la
  // période en cours » ne fait donc plus disparaître la progression déjà validée.
  const status = {};
  const re = /^(?:S1|S2)_i(\d+)_o(\d+)$/;
  Object.keys(DATA.itemChecks || {}).forEach(key=>{
    if(!DATA.itemChecks[key]) return;
    const m = re.exec(key);
    if(!m) return;
    const n = parseInt(m[1],10);
    if(!ITEM_BY_NUM[n]) return; // item supprimé depuis
    const occ = parseInt(m[2],10);
    if(!status[n]) status[n] = {revision:false, entrainement:false};
    if(occ===1) status[n].revision = true; else status[n].entrainement = true;
  });
  return status;
}

function itemHistory(itemNum){
  const entries = [];
  const covered = new Set();
  ['S1','S2'].forEach(phase=>{
    const cap = quotaThroughToday(phase);
    for(let idx=0; idx<cap; idx++){
      const s = getSlot(phase, idx);
      if(s && s.itemNum === itemNum){
        entries.push({ phase, idx, mode:s.mode, done:isItemTaskDone(s.nativeKey), iso: s.iso });
        covered.add(s.nativeKey);
      }
    }
  });
  // Progression déjà validée mais dont l'occurrence ne fait plus partie du planning
  // actuel (ex : matière retirée des « matières de la période en cours ») : on la
  // garde visible même si on ne connaît plus la date exacte à laquelle elle a eu lieu.
  const re = /^(S1|S2)_i(\d+)_o(\d+)$/;
  Object.keys(DATA.itemChecks || {}).forEach(key=>{
    if(!DATA.itemChecks[key] || covered.has(key)) return;
    const m = re.exec(key);
    if(!m || parseInt(m[2],10) !== itemNum) return;
    const mode = parseInt(m[3],10)===1 ? 'revision' : 'entrainement';
    entries.push({ phase:m[1], idx:null, mode, done:true, iso:null });
  });
  entries.sort((a,b)=> (a.iso||'') < (b.iso||'') ? -1 : 1);
  return entries;
}

function renderToday(){
  const container = document.getElementById('app');
  if(!CAL || CAL.length===0){
    container.innerHTML = `<div class="empty-state"><h2>Planning non configuré</h2><p>Renseigne tes dates et tes matières dans l'onglet Paramètres pour initialiser le planning.</p></div>`;
    return;
  }
  const start = parseISO(DATA.config.start);
  const today = todayDate();

  if(today < start){
    const d = daysBetween(today, start);
    container.innerHTML = `<div class="empty-state"><h2>Le programme démarre bientôt</h2><p>Ton dossier commence le ${fmtShort(start)} — encore ${d} jour${d>1?'s':''}.</p></div>`;
    return;
  }
  const lastDay = CAL[CAL.length-1];
  if(!lastDay || today > lastDay.date){
    container.innerHTML = `<div class="empty-state"><h2>Bonne chance !</h2><p>Le programme prévu est terminé.</p></div>`;
    return;
  }
  const day = findDay(todayIso());
  if(!day){ container.innerHTML = `<div class="empty-state"><p>Jour hors plage.</p></div>`; return; }

  const color = phaseColor(day.phase);
  let head = `
    <div class="day-head">
      <div class="stripe" style="background:${color}"></div>
      <p class="phase-lbl" style="color:${color}">${phaseLabel(day.phase)}</p>
      <h2>${fmtLong(day.date)}</h2>
      <p class="sub">${day.reported ? reportedDayLabel(day.reportedInfo) : day.weekend ? (day.phase==='ECOS' ? 'Entraînement ECOS — 4 SDD' : 'Week-end — LCA obligatoire') : (day.phase==='CONSOL' ? 'Pas de contenu nouveau' : day.phase==='ECOS' ? 'Entraînement ECOS — 4 SDD' : '')}</p>
      ${reportControlHTML(day)}
    </div>
  `;

  let body = '';
  if(day.reported){
    body = `<p class="empty-state">${reportedDayLabel(day.reportedInfo)} — rien de prévu ce jour-là. ${(!day.weekend && day.phase!=='CONSOL') ? 'Les items prévus glissent automatiquement aux jours suivants.' : ''}</p>`;
  } else if(day.phase==='ECOS'){
    body = day.tasks && day.tasks.length ? day.tasks.map(t=>sddTaskHTML(t)).join('') : `<div class="empty-state"><p>Aucune SDD dans le catalogue — accède à l'onglet SDD pour importer ou ajouter des situations.</p></div>`;
  } else if(day.weekend || day.phase==='CONSOL'){
    body = genericListHTML(day.iso, day.tasks);
  } else {
    const tasks = todaysDynamicTasks();
    if(tasks.length===0){
      body = `<div class="empty-state"><p>Aucun item en attente pour aujourd'hui — tu es à jour !</p></div>`;
    } else {
      body = tasks.map(t => itemTaskHTML(t)).join('');
    }
  }

  const custom = day.reported ? '' : customTasksHTML(day.iso);

  container.innerHTML = deadlineAlertsHTML() + weekSummaryHTML() + head + body + custom + `<footer class="note">Plus de temps aujourd'hui ? Avance librement (onglet Planning). Moins de temps ? Marque cette journée (repos, partiel, concours blanc…), ou laisse simplement les items non faits — ils remonteront automatiquement demain.</footer>`;
  bindTaskHandlers(container);
  if(!day.reported) bindCustomTaskHandlers(container, day.iso);
  bindReportControl(container, day.iso);
}

          <span>Marquer comme fait</span>
        </label>
      </div>`;
    } else {
      const isLca = entry.isLcaWeekend;
      const extraAttr = isLca ? `data-lcasat="${entry.satIso}" data-lcasun="${entry.sunIso}"` : '';
      return `<div class="retard-row">
        <div class="rtop"><span class="rdate">${d?fmtShort(d):''} · en retard depuis ${ageDays}j</span></div>
        <h4>${esc(entry.label)}</h4>
        <label class="rcheck">
          <input type="checkbox" data-genericiso="${entry.iso}" data-genericid="${entry.taskId}" ${extraAttr}>
          <span>Marquer comme fait</span>
        </label>
      </div>`;
    }
  }).join('');
  container.innerHTML = html;
  bindTaskHandlers(container);
  container.querySelectorAll('[data-itemkey], [data-genericiso]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ renderRetard(); });

function renderPlanning(){
  const container = document.getElementById('app');
  if(!CAL || CAL.length===0){
    container.innerHTML = `<div class="empty-state"><h2>Planning vide</h2><p>Configure tes dates dans les paramètres pour afficher la vue planning.</p></div>`;
    return;
  }
  if(selectedDayIso){
    const day = findDay(selectedDayIso);
    if(!day){ selectedDayIso=null; renderPlanning(); return; }
    const color = phaseColor(day.phase);
    let head = `<button class="back-link" id="backBtn">← Retour au planning</button>
    <div class="day-head"><div class="stripe" style="background:${color}"></div>
      <p class="phase-lbl" style="color:${color}">${phaseLabel(day.phase)} (aperçu nominal)</p>
      <h2>${fmtLong(day.date)}</h2>
      ${day.reported ? `<p class="sub">${reportedDayLabel(day.reportedInfo)}</p>` : ''}
      ${reportControlHTML(day)}
    </div>`;
    let body = day.reported
      ? `<p class="empty-state">${reportedDayLabel(day.reportedInfo)} — rien de prévu ce jour-là.</p>`
      : ((day.tasks && day.tasks[0] && day.tasks[0].kind==='item') ? day.tasks.map(t=>itemTaskHTML(t)).join('')
        : (day.tasks && day.tasks[0] && day.tasks[0].kind==='sdd') ? day.tasks.map(t=>sddTaskHTML(t)).join('')
        : genericListHTML(day.iso, day.tasks||[]));
    container.innerHTML = head + body + (day.reported ? '' : customTasksHTML(day.iso));
    document.getElementById('backBtn').addEventListener('click', ()=>{ selectedDayIso=null; renderPlanning(); });
    bindTaskHandlers(container);
    if(!day.reported) bindCustomTaskHandlers(container, day.iso);
    bindReportControl(container, day.iso);
    return;
  }
  let html = '';
  let lastMonth = '';
  CAL.forEach(day=>{
    const m = fmtMonthYear(day.date);
    if(m !== lastMonth){ html += `<div class="month-divider">${m}</div>`; lastMonth = m; }
    const color = phaseColor(day.phase);
    let itemsHtml = '';
    if(day.reported){
      itemsHtml = `<span class="pitem" style="background:var(--rule);color:var(--ink-soft)">${reportedDayLabel(day.reportedInfo)}</span>`;
    } else if(day.tasks[0] && day.tasks[0].kind==='item'){
      itemsHtml = day.tasks.map(t=>{
        const it = ITEM_BY_NUM[t.itemNum];
        const bg = t.mode==='revision' ? 'var(--accent)' : 'var(--amber)';
        return `<span class="pitem" style="background:${bg}" title="${it?esc(it.title):''}">#${it?it.num:t.itemNum}</span>`;
      }).join('');
    } else if(day.weekend){
      const hasLca = day.tasks.some(t=>t.id==='lca');
      itemsHtml = `<span class="pitem" style="background:${color}">${hasLca?'LCA + libre':'libre'}</span>`;
    } else if(day.tasks[0] && day.tasks[0].kind==='sdd'){
      itemsHtml = day.tasks.map(t=>{
        const sdd = SDD_BY_NUM[t.num];
        return `<span class="pitem" style="background:${color}" title="${sdd?esc(sdd.title):''}">SDD${t.num}</span>`;
      }).join('');
    } else if(day.phase==='ECOS'){
      itemsHtml = `<span class="pitem" style="background:var(--rule);color:var(--ink-soft)">aucune SDD</span>`;
    } else {
      itemsHtml = `<span class="pitem" style="background:${color}">consolidation</span>`;
    }
    html += `<div class="plan-row" data-iso="${day.iso}" style="border-left-color:${color}">
      <span class="pd">${fmtShort(day.date)}</span>
      <span class="pitems">${itemsHtml}</span>
    </div>`;
  });
  container.innerHTML = `<p class="weekend-note">Aperçu nominal (hors reports/retards).</p>` + html;
  container.querySelectorAll('.plan-row').forEach(row=>{
    row.addEventListener('click', ()=>{ selectedDayIso = row.getAttribute('data-iso'); renderPlanning(); });
  });
}

function renderItemHistory(itemNum){
  const container = document.getElementById('app');
  const item = ITEM_BY_NUM[itemNum];
  if(!item) return;
  const hist = itemHistory(itemNum);
  let rows = hist.length ? hist.map(h=>{
    const d = h.iso ? parseISO(h.iso) : null;
    const modeLabel = h.mode==='revision' ? 'Révision' : 'Entraînement';
    return `<div class="hist-entry">
      <span class="hdate">${d ? fmtShort(d) : '—'}</span>
      <span class="hist-mode ${h.done ? h.mode : 'pending'}">${h.done ? modeLabel : (modeLabel+' — à faire')}</span>
    </div>`;
  }).join('') : `<p class="hist-empty">Pas encore d'historique pour cet item.</p>`;
  container.innerHTML = `
    <button class="back-link" id="backBtn">← Retour à la progression</button>
    <div class="history-panel">
      ${catPillsHTML(item.cats)}
      <h3 style="margin-top:8px;">Item ${item.num} — ${esc(item.title)}</h3>
      ${rows}
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{ selectedItemNum = null; render(); });
}

function renderProgress(){
  const container = document.getElementById('app');
  if(selectedItemNum){ renderItemHistory(selectedItemNum); return; }

  const status = computeItemStatus();

  function cardFor(cat){
    const nums = itemsOfCat(cat);
    let rev=0, ent=0;
    nums.forEach(n=>{ const s=status[n]; if(s){ if(s.revision) rev++; if(s.entrainement) ent++; } });
    const total = nums.length;
    const revPct = total? Math.round(rev/total*100):0;
    const entPct = total? Math.round(ent/total*100):0;
    const dl = DATA.subjectDeadlines && DATA.subjectDeadlines[cat];
    const dlLabel = dl ? ` · DL ${fmtShort(parseISO(dl))}` : '';
    return `<div class="spec-card" data-cat="${cat}">
      <div class="row1"><span class="name">${CAT_LABELS[cat]||cat}${dlLabel}</span><span class="pct">${rev}/${total} vus · ${ent}/${total} entraînés</span></div>
      <div class="dualbar"><div class="seg-rev" style="width:${revPct}%"></div><div class="seg-ent" style="width:${Math.max(0,entPct-revPct)}%"></div></div>
    </div>`;
  }
  let html = '';
  const newC = currentNewCats();
  if(newC.length > 0){
    html += `<p class="section-title">Matières de la période en cours (trimestre / semestre / stage)</p>`;
    newC.forEach(c=>{ html += cardFor(c); });
    html += `<p class="section-title">Autres matières (révision)</p>`;
    currentReviewCats().forEach(c=>{ html += cardFor(c); });
  } else {
    html += `<p class="section-title">Tous les collèges</p>`;
    ALL_CATS.forEach(c=>{ html += cardFor(c); });
  }
  html += `<p style="font-size:11px;color:var(--ink-soft);margin:14px 0;">Teal = items lus au moins une fois · ambre = items entraînés au moins une fois. Clique une matière pour voir le détail par item.</p>`;
  container.innerHTML = html;
  container.querySelectorAll('.spec-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const cat = card.getAttribute('data-cat');
      renderCatDetail(cat);
    });
  });
}

function renderCatDetail(cat){
  const container = document.getElementById('app');
  const nums = itemsOfCat(cat);
  let rows = nums.map(n=>{
    const item = ITEM_BY_NUM[n];
    const hist = itemHistory(n);
    const doneCount = hist.filter(h=>h.done).length;
    return `<li class="item-row" data-item="${n}">
      <span class="inum">#${n}</span>
      <span class="ititle">${esc(item.title)}</span>
      <span class="icount">${doneCount}× fait</span>
    </li>`;
  }).join('');
  container.innerHTML = `
    <button class="back-link" id="backBtn">← Retour à la progression</button>
    <p class="section-title">${CAT_LABELS[cat]||cat}</p>
    <ul class="item-list">${rows}</ul>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{ render(); });
  container.querySelectorAll('.item-row').forEach(row=>{
    row.addEventListener('click', ()=>{

}

function renderLCA(){
  const container = document.getElementById('app');
  const today = todayDate();
  const allSaturdays = CAL.filter(d => d.date.getDay()===6);
  const pastSaturdays = allSaturdays.filter(d=>d.date <= today).reverse();

  let streak = 0;
  for(const sat of pastSaturdays){
    const sunIso = toISO(addDays(sat.date,1));
    if(isGenericDone(sat.iso,'lca') || isGenericDone(sunIso,'lca')) streak++; else break;
  }

  const methodoOptions = ['Essai randomisé','Cohorte','Cas-témoins','Méta-analyse / revue systématique','Étude transversale','Autre'];

  let rows = '';
  allSaturdays.forEach(sat=>{
    const sunDate = addDays(sat.date,1);
    const sunIso = toISO(sunDate);
    const done = isGenericDone(sat.iso,'lca') || isGenericDone(sunIso,'lca');
    const entry = (DATA.lcaEntries && DATA.lcaEntries[sat.iso]) || {};
    const hasNote = !!(entry.title || entry.notes);
    rows += `<div class="lca-row ${done?'done':''}">
      <span>${fmtShort(sat.date)} – ${fmtShort(sunDate)}</span>
      <input type="checkbox" data-sat="${sat.iso}" data-sun="${sunIso}" ${done?'checked':''}>
    </div>
    <button type="button" class="swap-toggle" data-lcatoggle="${sat.iso}" style="margin:-6px 0 10px;">📝 ${hasNote? 'Voir / modifier la fiche' : 'Ajouter la fiche de lecture'}</button>
    <div class="swap-panel lca-notes" id="lcanotes-${sat.iso}">
      <div class="frow"><input type="text" class="lca-title" data-lcatitle="${sat.iso}" placeholder="Titre de l'article" value="${esc(entry.title||'')}"></div>
      <div class="frow" style="margin-top:6px;">
        <select class="lca-methodo" data-lcamethodo="${sat.iso}">
          <option value="">Méthodologie…</option>
          ${methodoOptions.map(m=>`<option value="${m}" ${entry.methodo===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <textarea class="lca-note-text" data-lcanote="${sat.iso}" placeholder="Points clés, pièges méthodo repérés…" style="width:100%;margin-top:6px;min-height:60px;font-family:var(--sans);font-size:13px;padding:8px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);color:var(--ink);">${esc(entry.notes||'')}</textarea>
    </div>
    `;
  });

  container.innerHTML = `
    <div class="lca-streak"><div class="n">${streak}</div><div class="l">week-end${streak>1?'s':''} de LCA d'affilée</div></div>
    ${rows || '<p class="hist-empty">Aucun week-end programmé dans le calendrier actuel.</p>'}
  `;
  container.querySelectorAll('.lca-row input').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const sat = e.target.getAttribute('data-sat');
      const sun = e.target.getAttribute('data-sun');
      setGenericDone(sat,'lca', e.target.checked);
      setGenericDone(sun,'lca', e.target.checked);
      renderVitals();
      renderLCA();
    });
  });
  container.querySelectorAll('[data-lcatoggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = document.getElementById('lcanotes-'+btn.getAttribute('data-lcatoggle'));
      if(panel) panel.classList.toggle('open');
    });
  });
  function saveLcaEntry(iso){
    if(!DATA.lcaEntries) DATA.lcaEntries = {};
    const title = document.querySelector(`[data-lcatitle="${iso}"]`).value.trim();
    const methodo = document.querySelector(`[data-lcamethodo="${iso}"]`).value;
    const notes = document.querySelector(`[data-lcanote="${iso}"]`).value.trim();
    if(!title && !methodo && !notes){ delete DATA.lcaEntries[iso]; }
    else { DATA.lcaEntries[iso] = {title, methodo, notes}; }
    saveData();
  }
  container.querySelectorAll('.lca-title, .lca-methodo').forEach(el=>{
    el.addEventListener('change', ()=> saveLcaEntry(el.getAttribute('data-lcatitle')||el.getAttribute('data-lcamethodo')));
  });
  container.querySelectorAll('.lca-note-text').forEach(el=>{
    el.addEventListener('blur', ()=> saveLcaEntry(el.getAttribute('data-lcanote')));
  });
}

    const byNum = {};
    DATA.sddItems.forEach(([n,t])=>{ byNum[n] = t; });
    let imported = 0, skipped = 0;
    lines.forEach(line=>{
      const sep = line.includes(';') ? ';' : (line.includes('\t') ? '\t' : null);
      if(!sep){ skipped++; return; }
      const [numStr, ...rest] = line.split(sep);
      const num = parseInt(numStr.trim(),10);
      const title = rest.join(sep).trim();
      if(!num || !title){ skipped++; return; }
      byNum[num] = title;
      imported++;
    });
    DATA.sddItems = Object.keys(byNum).map(n=>[parseInt(n,10), byNum[n]]);
    rebuildAll();
    CAL = buildCalendar(DATA.config, DATA.reportedDays);
    saveData();
    render();
    alert(`${imported} SDD importée${imported>1?'s':''}${skipped>0?`, ${skipped} ligne${skipped>1?'s':''} ignorée${skipped>1?'s':''}`:''}.`);
  });

  document.getElementById('btnClearSdd').addEventListener('click', ()=>{
    if(!confirm('Vider tout le catalogue SDD ? Les cases déjà cochées resteront en mémoire mais ne seront plus associées à un titre.')) return;
    DATA.sddItems = [];
    rebuildAll();
    CAL = buildCalendar(DATA.config, DATA.reportedDays);
    saveData();
    render();
  });

  container.querySelectorAll('[data-delsdd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.getAttribute('data-delsdd'),10);
      const sddObj = SDD_BY_NUM[num];
      if(confirm(`Supprimer la SDD #${num} — "${sddObj ? sddObj.title : ''}" ?`)){
        deleteSddItem(num);
        render();
      }
    });
  });

  container.querySelectorAll('[data-editsdd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.getAttribute('data-editsdd'),10);
      const row = btn.closest('.item-manage-row');
      const sddObj = SDD_BY_NUM[num] || {title:''};
      row.querySelector('.imactions').innerHTML = '';
      const form = document.createElement('div');
      form.className = 'item-edit-form';
      form.innerHTML = `
        <input type="text" value="${esc(sddObj.title)}" id="editSddTitle-${num}">
        <div class="imactions">
          <button class="btn-primary" id="saveSddEdit-${num}">Enregistrer</button>
          <button class="btn-secondary" id="cancelSddEdit-${num}">Annuler</button>
        </div>
      `;
      row.appendChild(form);
      document.getElementById(`saveSddEdit-${num}`).addEventListener('click', ()=>{
        const newTitle = document.getElementById(`editSddTitle-${num}`).value.trim();
        if(!newTitle){ alert('Le titre ne peut pas être vide.'); return; }
        updateSddItem(num, newTitle);
        render();
      });
      document.getElementById(`cancelSddEdit-${num}`).addEventListener('click', ()=>{ render(); });
    });
  });
}

// ---------- thème clair/sombre ----------
function applyTheme(){
  document.body.classList.toggle('dark', !!(DATA && DATA.darkMode));
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = (DATA && DATA.darkMode) ? 'Mode clair' : 'Mode sombre';
}

// ---------- assistant de configuration initiale ----------
function renderObSubjectList(){
  const el = document.getElementById('obSubjectList');
  if(!el) return;
  el.innerHTML = ALL_CATS.map(c=>`<label class="subject-row"><input type="checkbox" class="ob-newcat-check" value="${c}"> ${CAT_LABELS[c]}</label>`).join('');
}

// ---------- routeur d'affichage principal ----------
function render(){
  renderVitals();
  updateTitles();
  switch(currentTab){
    case 'today': renderToday(); break;
    case 'retard': renderRetard(); break;
    case 'planning': renderPlanning(); break;
    case 'progress': renderProgress(); break;
    case 'lca': renderLCA(); break;
    case 'items': renderItemsManager(); break;
    case 'sdd': renderSddManager(); break;
    case 'settings': renderSettings(); break;
    default: renderToday();
  }
}

// ---------- initialisation ----------
async function init(){
  DATA = await loadData();
  await tryReconnectBackupFile();

  const ghCfg = getGithubConfig();
  if(ghCfg && ghCfg.token && ghCfg.owner && ghCfg.repo){
    const remote = await githubLoadData();
    if(remote){
      const snapshot = getGhSnapshot();
      DATA = mergeData(remote, DATA, snapshot);
      DATA.config = Object.assign(getDefaultConfig(), DATA.config || {});
      if(!DATA.items) DATA.items = ITEMS_RAW.map(([n,t,c])=>[n,t,c]);
      if(!DATA.sddItems) DATA.sddItems = SDD_SEED_RAW.map(([n,t])=>[n,t]);
    }
  }

  rebuildAll();
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  applyTheme();
  updateTitles();

  document.getElementById('themeToggle').addEventListener('click', ()=>{
    DATA.darkMode = !DATA.darkMode;
    applyTheme();
    saveData();
  });

  document.querySelectorAll('#tabbar button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentTab = btn.getAttribute('data-tab');
      selectedDayIso = null;
      selectedItemNum = null;
      document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b===btn));
      render();
    });
  });

  document.getElementById('btnObSelectAll').addEventListener('click', ()=>{
    document.querySelectorAll('.ob-newcat-check').forEach(cb=>{ cb.checked = true; });
  });
  document.getElementById('btnObDeselectAll').addEventListener('click', ()=>{
    document.querySelectorAll('.ob-newcat-check').forEach(cb=>{ cb.checked = false; });
  });
  document.getElementById('obSubmit').addEventListener('click', ()=>{
    const start = document.getElementById('obStart').value;
    const exam = document.getElementById('obExam').value;
    if(!start || !exam){ alert("Renseigne au moins la date de début et la date d'examen."); return; }
    DATA.config.studentYear = parseInt(document.getElementById('obStudentYear').value,10) || 6;
    DATA.config.start = start;
    DATA.config.exam = exam;
    const s1EndVal = document.getElementById('obS1End').value;
    DATA.config.s1End = s1EndVal || toISO(addDays(parseISO(start),150));
    const mode = document.getElementById('obStudyMode').value;
    DATA.config.studyModeP1 = mode;
    DATA.config.studyModeP2 = mode;
    DATA.config.ecosDate = document.getElementById('obEcos').value || '';
    DATA.config.newCats = Array.from(document.querySelectorAll('.ob-newcat-check:checked')).map(el=>el.value);
    DATA.onboarded = true;
    rebuildAll();
    CAL = buildCalendar(DATA.config, DATA.reportedDays);
    updateTitles();
    saveData();
    document.getElementById('onboardOverlay').classList.add('hidden');
    render();
  });

  if(!DATA.onboarded){
    renderObSubjectList();
    document.getElementById('obStart').value = DATA.config.start || toISO(todayDate());
    document.getElementById('obExam').value = DATA.config.exam || '';
    document.getElementById('obS1End').value = DATA.config.s1End || '';
    document.getElementById('onboardOverlay').classList.remove('hidden');
  }

  render();
}

init();
})();
</script>
