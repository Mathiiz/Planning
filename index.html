<style>
  :root{
    --ink:#16233D; --ink-soft:#3E4A63; --paper:#ECEAE2; --paper-raised:#F5F3EC;
    --navy:#101B30; --accent:#0E7C7B; --accent-dark:#0A5F5E; --amber:#B8720A;
    --rule:#D3CFC0; --rule-soft:#E2DFD3; --white:#FFFEFB; --danger:#A6453A;
    --radius:3px;
    --serif:"Iowan Old Style","Palatino Linotype","Sitka Text",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    --c-psy:#0E7C7B; --c-ger:#B8720A; --c-mi:#7A5C8E; --c-ped:#3B6FA0; --c-onco:#A6453A; --c-hemato:#8A6D1E; --c-other:#6B7280;
  }
  body.dark{
    --ink:#E8E6DD; --ink-soft:#AAB4C4; --paper:#0F1420; --paper-raised:#161D2C;
    --navy:#080C14; --rule:#2A3242; --rule-soft:#212838; --white:#1A2233; --danger:#D3695C;
    --accent:#1FA6A3; --accent-dark:#3FC1BE; --amber:#D69433;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .15s,color .15s;}
  ::selection{background:var(--accent);color:var(--white);}
  a{color:var(--accent-dark);}

  .chart-header{background:var(--navy);color:#fff;padding:18px 20px 14px;position:sticky;top:0;z-index:20;}
  .chart-header .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9FB3C8;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;}
  .theme-btn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;font-size:10px;padding:3px 9px;cursor:pointer;font-family:var(--mono);}
  .chart-header h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 12px;letter-spacing:.01em;color:#fff;}
  .vitals{display:flex;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);flex-wrap:wrap;}
  .vital{flex:1 1 100px;padding:9px 12px;border-right:1px solid rgba(255,255,255,.14);}
  .vital:last-child{border-right:none;}
  .vital .num{font-family:var(--mono);font-size:18px;font-weight:600;color:#fff;line-height:1.1;}
  .vital .lbl{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#8DA0B6;margin-top:3px;}

  .settings-toggle{font-family:var(--mono);font-size:11px;color:#9FB3C8;background:none;border:none;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline;}
  .settings-panel{margin-top:10px;padding:12px;background:rgba(255,255,255,.06);border-radius:var(--radius);display:none;gap:10px;flex-wrap:wrap;}
  .settings-panel.open{display:flex;}
  .settings-panel label{font-size:11px;color:#9FB3C8;display:flex;flex-direction:column;gap:4px;}
  .settings-panel input{font-family:var(--mono);padding:5px 7px;border-radius:2px;border:none;}

  .tabbar{display:flex;background:var(--paper-raised);border-bottom:1px solid var(--rule);position:sticky;top:92px;z-index:19;overflow-x:auto;}
  .tabbar button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:12px 13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;position:relative;}
  .tabbar button.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
  .tabbar button .badge{position:absolute;top:6px;right:2px;background:var(--danger);color:#fff;font-size:9px;font-family:var(--mono);border-radius:8px;padding:0 4px;line-height:1.4;}

  .wrap{max-width:740px;margin:0 auto;padding:18px 16px 80px;}

  .week-summary{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;}
  .week-summary .wtitle{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 8px;}
  .week-summary .wrow{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--rule-soft);}
  .week-summary .wrow:last-child{border-bottom:none;}
  .week-summary .wval{font-family:var(--mono);font-weight:600;}
  .wval.ok{color:var(--accent-dark);}
  .wval.warn{color:var(--danger);}

  .day-head{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;}
  .day-head .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .day-head .phase-lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 4px;}
  .day-head h2{font-family:var(--serif);font-size:18px;margin:0 0 2px;font-weight:600;text-transform:capitalize;}
  .day-head .sub{font-size:12px;color:var(--ink-soft);}
  .report-btn{margin-top:10px;font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:20px;padding:5px 12px;cursor:pointer;}
  .report-btn.active{background:var(--amber);color:#fff;border-color:var(--amber);}

  .task-card{background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .task-card.revision{border-left-color:var(--accent);}
  .task-card.entrainement{border-left-color:var(--amber);}
  .task-card .top-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
  .mode-badge{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:2px;color:#fff;}
  .mode-badge.revision{background:var(--accent);}
  .mode-badge.entrainement{background:var(--amber);}
  .cat-pill{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:2px;color:#fff;opacity:.85;}
  .item-num{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .hist-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-left:auto;}
  .task-card h3{font-family:var(--serif);font-size:15.5px;margin:0 0 6px;font-weight:600;line-height:1.35;}
  .task-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .task-check{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .task-check input[type=checkbox]{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--white);flex-shrink:0;}
  .task-check input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .task-check input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .task-check span{font-size:13px;font-weight:600;}
  .task-card.done{opacity:.6;}
  .task-card.done h3{text-decoration:line-through;}

  .generic-list{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);overflow:hidden;}
  .generic-list li{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule-soft);font-size:13.5px;}
  .generic-list li:last-child{border-bottom:none;}
  .generic-list input[type=checkbox]{appearance:none;width:17px;height:17px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--white);flex-shrink:0;}
  .generic-list input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .generic-list input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .generic-list li.done label{text-decoration:line-through;color:#8B8A80;}
  .generic-list label{cursor:pointer;flex:1;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state h2{font-family:var(--serif);color:var(--ink);}

  .plan-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--rule);border-radius:var(--radius);margin-bottom:5px;cursor:pointer;font-size:12.5px;}
  .plan-row:hover{border-color:var(--accent);}
  .plan-row .pd{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);width:74px;flex-shrink:0;text-transform:capitalize;}
  .plan-row .pitems{flex:1;display:flex;gap:5px;flex-wrap:wrap;}
  .plan-row .pitem{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:2px;color:#fff;}
  .month-divider{font-family:var(--serif);font-size:15px;font-weight:600;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);}
  .weekend-note{font-size:11.5px;color:var(--ink-soft);background:var(--paper-raised);border:1px dashed var(--rule);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}

  .spec-card{background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);padding:13px 16px;margin-bottom:8px;cursor:pointer;}
  .spec-card .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
  .spec-card .name{font-weight:600;font-size:13px;}
  .spec-card .pct{font-family:var(--mono);font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .dualbar{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;display:flex;}
  .dualbar .seg-rev{height:100%;background:var(--accent);}
  .dualbar .seg-ent{height:100%;background:var(--amber);}
  .section-title{font-family:var(--serif);font-size:16px;font-weight:600;margin:22px 0 10px;}

  .item-list{list-style:none;margin:0;padding:0;}
  .item-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);margin-bottom:5px;font-size:12.5px;cursor:pointer;}
  .item-row .inum{font-family:var(--mono);color:var(--ink-soft);width:32px;flex-shrink:0;}
  .item-row .ititle{flex:1;}
  .item-row .icount{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);}

  .history-panel{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;}
  .history-panel h3{font-family:var(--serif);font-size:16px;margin:0 0 4px;}
  .history-panel .hcat{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;display:inline-block;padding:2px 7px;border-radius:2px;margin-bottom:10px;}
  .hist-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px;}
  .hist-entry:last-child{border-bottom:none;}
  .hist-entry .hdate{font-family:var(--mono);color:var(--ink-soft);}
  .hist-mode{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:2px;color:#fff;}
  .hist-mode.revision{background:var(--accent);}
  .hist-mode.entrainement{background:var(--amber);}
  .hist-mode.pending{background:var(--rule);color:var(--ink-soft);}
  .hist-empty{color:var(--ink-soft);font-size:12.5px;padding:10px 0;}

  .lca-streak{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:18px;}
  .lca-streak .n{font-family:var(--mono);font-size:32px;font-weight:700;}
  .lca-streak .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9FB3C8;margin-top:2px;}
  .lca-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--white);border:1px solid var(--rule-soft);border-radius:var(--radius);margin-bottom:6px;font-size:13px;}
  .lca-row.done{border-left:3px solid var(--accent);}

  .retard-row{background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--danger);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;}
  .retard-row .rtop{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap;}
  .retard-row .rdate{font-family:var(--mono);font-size:10.5px;color:var(--danger);}
  .retard-row h4{font-family:var(--serif);font-size:14px;margin:0 0 8px;font-weight:600;}
  .retard-row .rcheck{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .retard-row .rcheck input{appearance:none;width:17px;height:17px;border:1.5px solid var(--ink-soft);border-radius:3px;cursor:pointer;position:relative;background:var(--white);flex-shrink:0;}
  .retard-row .rcheck input:checked{background:var(--accent);border-color:var(--accent);}
  .retard-row .rcheck input:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .retard-row .rcheck span{font-size:12.5px;font-weight:600;}

  footer.note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:26px;line-height:1.6;}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:13px;}
  .back-link{color:var(--accent-dark);background:none;border:none;font-family:var(--mono);font-size:11.5px;cursor:pointer;margin-bottom:14px;text-decoration:underline;padding:0;}

  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .cat-checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 10px;margin-bottom:4px;}
  .cat-checkbox{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .cat-checkbox input{width:14px;height:14px;cursor:pointer;flex-shrink:0;}
  .cat-checkbox span{line-height:1.3;}
  .chip{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--rule);background:var(--white);color:var(--ink-soft);cursor:pointer;}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .add-item-form .frow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .add-item-form input[type=text], .add-item-form select{
    font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);color:var(--ink);flex:1;min-width:140px;
  }
  .btn-primary{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;cursor:pointer;}
  .btn-secondary{font-family:var(--sans);font-size:12.5px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--white);color:var(--ink-soft);cursor:pointer;}
  .btn-danger{font-family:var(--sans);font-size:12.5px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--danger);background:none;color:var(--danger);cursor:pointer;}

  .swap-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule-soft);}
  .swap-toggle{font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:20px;padding:5px 10px;cursor:pointer;}
  .swap-panel{display:none;}
  .swap-panel.open{display:block;}
  .swap-panel input[type=text]{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);color:var(--ink);flex:1;}

  .subject-config-list{max-height:260px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--radius);padding:4px 8px;}
  .subject-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px;}
  .subject-row:last-child{border-bottom:none;}
  .subject-row label{display:flex;align-items:center;gap:6px;font-weight:normal;flex:1;}
  .subject-row input[type=date]{font-family:var(--sans);font-size:11.5px;padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-raised);color:var(--ink);width:130px;}

  .item-manage-row{background:var(--white);border:1px solid var(--rule-soft);border-left:4px solid var(--rule);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;}
  .item-manage-row .imtop{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .item-manage-row .imnum{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .item-manage-row .imtitle{flex:1;font-size:13.5px;font-weight:600;}
  .item-manage-row .imactions{display:flex;gap:6px;margin-top:8px;}
  .item-edit-form{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .item-edit-form input[type=text], .item-edit-form select{
    font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);color:var(--ink);
  }

  .onboard-overlay{position:fixed;inset:0;background:rgba(10,14,20,0.72);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  .onboard-overlay.hidden{display:none;}
  .onboard-card{background:var(--white);border-radius:var(--radius);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .onboard-card h2{margin:0 0 6px;font-size:19px;}
  .onboard-card p.lead{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  .onboard-card label{display:block;font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .onboard-card input[type=date], .onboard-card select{

<div class="onboard-overlay hidden" id="onboardOverlay">
  <div class="onboard-card">
    <h2>Bienvenue 👋</h2>
    <p class="lead">Quelques infos pour construire ton planning. Tu pourras tout modifier plus tard dans les réglages.</p>
    <label>Année d'étude actuelle
      <select id="obStudentYear">
        <option value="3">3ᵉ année (DFGSM3)</option>
        <option value="4">4ᵉ année (DFASM1)</option>
        <option value="5">5ᵉ année (DFASM2)</option>
        <option value="6">6ᵉ année (DFASM3 — EDN)</option>
      </select>
    </label>
    <label>Début des révisions<input type="date" id="obStart"></label>
    <label>Date de l'examen (partiels ou EDN)<input type="date" id="obExam"></label>
    <label>Début des tours de révision générale
      <input type="date" id="obS1End">
      <span class="hint">Date à partir de laquelle tu révises tout le programme cumulativement. Si ça ne te concerne pas encore, mets une date proche de ton examen.</span>
    </label>
    <label>Matières nouvelles de cette période
      <span class="hint">Coche les matières que tu découvres actuellement. Ajouter une DL de partiel sur une matière (ici ou plus tard) la fait passer en priorité.</span>
      <div class="subject-config-list" id="obSubjectList" style="margin-top:8px;"></div>
    </label>
    <button type="button" class="onboard-submit" id="obSubmit">Créer mon planning</button>
  </div>
</div>

<div class="chart-header">
  <p class="eyebrow"><span>Dossier de révision personnel</span><button class="theme-btn" id="themeToggle">Mode sombre</button></p>
  <h1>EDN — Planning de révisions</h1>
  <div class="vitals" id="vitals"></div>
  <button class="settings-toggle" id="settingsToggle">Ajuster les dates ▾</button>
  <div class="settings-panel" id="settingsPanel">
    <label>Début des révisions<input type="date" id="cfgStart"></label>
    <label>Début des tours de révision générale<input type="date" id="cfgS1End">
      <span style="font-size:10.5px;color:#9FB3C8;display:block;margin-top:4px;">La date à partir de laquelle tu passes en révision cumulative de tout le programme, tous items confondus. Avant cette date, seules les matières "nouvelles" que tu as cochées ci-dessous tournent (les bascules entre trimestres/semestres se gèrent avec les DL de partiels, pas avec cette date).</span>
    </label>
    <label>Date des EDN (estimation)<input type="date" id="cfgExam"></label>
    <label>Année d'étude actuelle
      <select id="cfgStudentYear">
        <option value="3">3ᵉ année (DFGSM3)</option>
        <option value="4">4ᵉ année (DFASM1)</option>
        <option value="5">5ᵉ année (DFASM2)</option>
        <option value="6">6ᵉ année (DFASM3 — EDN)</option>
      </select>
      <span style="font-size:10.5px;color:#9FB3C8;display:block;margin-top:4px;">Détermine notamment si la LCA apparaît dans les révisions du week-end (à partir de la 5ᵉ année).</span>
    </label>
    <label>Matières nouvelles de la période & DL de partiels
      <span style="font-size:10.5px;color:#9FB3C8;display:block;margin-bottom:6px;">Coche les matières que tu découvres actuellement (remplace les 6 par défaut). Ajoute une DL sur une matière (nouvelle ou déjà vue) pour faire remonter tous ses items en tête de file avant cette date.</span>
      <div class="subject-config-list" id="subjectConfigList"></div>
    </label>
    <label>Sauvegarde
      <span style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" id="btnExport" class="settings-toggle" style="margin:0;">Exporter ↓</button>
        <button type="button" id="btnImportTrigger" class="settings-toggle" style="margin:0;">Importer ↑</button>
        <input type="file" id="fileImport" accept="application/json" style="display:none;">
      </span>
    </label>
    <label>Fichier de secours (recommandé)
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button type="button" id="btnLinkFile" class="settings-toggle" style="margin:0;">Lier un fichier local</button>
        <span id="linkFileStatus" style="font-size:10.5px;color:#9FB3C8;"></span>
      </span>
    </label>
    <label>Synchronisation GitHub (sauvegarde auto à chaque modification)
      <span style="display:flex;flex-direction:column;gap:6px;">
        <input type="text" id="ghOwner" placeholder="Utilisateur ou organisation GitHub (ex: mathiiz)">
        <input type="text" id="ghRepo" placeholder="Nom du dépôt (ex: edn-planning)">
        <input type="text" id="ghPath" placeholder="Nom du fichier de données (ex: data.json)">
        <input type="text" id="ghBranch" placeholder="Branche (ex: main)">
        <input type="password" id="ghToken" placeholder="Token d'accès personnel GitHub">
        <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button type="button" id="btnGhSave" class="settings-toggle" style="margin:0;">Enregistrer la connexion</button>

          <span id="ghStatus" style="font-size:10.5px;color:#9FB3C8;"></span>
        </span>
      </span>
    </label>
  </div>
</div>

function currentNewCats(){

// une matière avec une DL (date de partiel) passe en tête de file, DL la plus proche en premier
function categoriesByDeadlinePriority(cats){
  const dl = (DATA && DATA.subjectDeadlines) || {};
  const withDL = cats.filter(c=>dl[c]).sort((a,b)=> dl[a] < dl[b] ? -1 : (dl[a] > dl[b] ? 1 : 0));
  const withoutDL = cats.filter(c=>!dl[c]);
  return {withDL, withoutDL};
}

let ITEM_BY_NUM = {};
let CURRENT_ITEMS = [];
// an item now carries an array of colleges (cats); cats[0] is the "primary" college
// used for S1/S2 scheduling, the full array is used for display, filtering and progress.
function normalizeCats(c){ return Array.isArray(c) ? c.slice() : [c || 'other']; }
function itemsOfCat(cat){ return CURRENT_ITEMS.filter(([n,t,cats])=> normalizeCats(cats).includes(cat)).map(([n])=>n); }
function itemsOfPrimaryCat(cat){ return CURRENT_ITEMS.filter(([n,t,cats])=> normalizeCats(cats)[0]===cat).map(([n])=>n); }

function roundRobin(lists){
  const out = []; let idx=0, more=true;
  while(more){ more=false; for(const l of lists){ if(idx<l.length){ out.push(l[idx]); more=true; } } idx++; }
  return out;
}
let S1_QUEUE = [];
let S2_QUEUE = [];
const ITEMS_PER_DAY = {S1:2, S2:3};

function rebuildAll(){
  // normalize any legacy single-string categories to arrays (backward compatibility)
  DATA.items = DATA.items.map(([n,t,c])=>[n,t,normalizeCats(c)]);
  CURRENT_ITEMS = DATA.items;
  ITEM_BY_NUM = {};
  CURRENT_ITEMS.forEach(([n,t,cats])=>{ ITEM_BY_NUM[n] = {num:n, title:t, cats:cats, cat: cats[0]}; });
  S1_QUEUE = buildS1Queue();
  S2_QUEUE = buildS2Queue();
}
// file S1 (matières nouvelles de la période) : les matières avec DL passent en bloc en tête
// (DL la plus proche d'abord), le reste continue en round-robin comme avant.
function buildS1Queue(){
  const cats = currentNewCats();
  const {withDL, withoutDL} = categoriesByDeadlinePriority(cats);
  const urgent = [];
  withDL.forEach(c=>{ itemsOfPrimaryCat(c).forEach(n=>urgent.push(n)); });
  const rest = roundRobin(withoutDL.map(itemsOfPrimaryCat));
  return urgent.concat(rest);
}
// file S2 (révision globale) : mêmes principe, sur l'ensemble des matières (une matière déjà
// vue en cours peut aussi avoir une DL de partiel et doit repasser en priorité de révision).
function buildS2Queue(){
  const {withDL} = categoriesByDeadlinePriority(ALL_CATS);
  const seen = new Set();
  const urgent = [];
  withDL.forEach(c=>{
    itemsOfCat(c).forEach(n=>{ if(!seen.has(n)){ urgent.push(n); seen.add(n); } });
  });
  const rest = CURRENT_ITEMS.map(([n])=>n).filter(n=>!seen.has(n));
  return urgent.concat(rest);
}
function nextItemId(){
  let max = 0;
  CURRENT_ITEMS.forEach(([n])=>{ if(n>max) max=n; });
  return Math.max(max+1, 368);
}

  const num = nextItemId();
  DATA.items.push([num, title, cats.length?cats:['other']]);

function updateItem(num, title, cats){
  const row = DATA.items.find(([n])=>n===num);
  if(!row) return;
  row[1] = title; row[2] = cats.length?cats:['other'];
  rebuildAll();
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  saveData();
}
function deleteItem(num){
  DATA.items = DATA.items.filter(([n])=>n!==num);
  rebuildAll();
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  saveData();
}

// task index (idx, within a phase's infinite cycling queue) -> {itemNum, mode}
// key is based on item identity + occurrence count (not raw position) so it stays
// valid even if items are later added, edited, or removed from the catalog.
function taskForIndex(phase, idx){
  const queue = phase==='S1' ? S1_QUEUE : S2_QUEUE;
  if(queue.length===0) return { key: phase+'_empty_'+idx, itemNum:null, mode:'revision', occurrence:1 };
  const pos = idx % queue.length;
  const occurrence = Math.floor(idx/queue.length)+1;
  const mode = occurrence===1 ? 'revision' : 'entrainement';
  const itemNum = queue[pos];
  return { key: phase+'_i'+itemNum+'_o'+occurrence, itemNum, mode, occurrence };
}

  const exam = parseISO(cfg.exam);
  const consolStart = addDays(exam,-21);
  const days = [];
  INDEX_DATE = {S1:{}, S2:{}};
  let counters = {S1:0, S2:0};
  let cur = new Date(start);
  while(cur <= exam){
    const weekend = isWeekendDate(cur);
    let phase;
    if(cur < s1End) phase='S1';
    else if(cur >= consolStart) phase='CONSOL';
    else phase='S2';
    const iso = toISO(cur);
    const reported = !!reportedDays[iso];
    const day = { date:new Date(cur), iso, phase, weekend, reported };

    if(!weekend && (phase==='S1'||phase==='S2') && !reported && (phase==='S1'?S1_QUEUE.length:S2_QUEUE.length)>0){
      const perDay = ITEMS_PER_DAY[phase];
      const baseIdx = counters[phase]*perDay;
      day.tasks = [];
      for(let i=0;i<perDay;i++){
        const idx = baseIdx+i;
        const e = effectiveItemFor(phase, idx);
        INDEX_DATE[phase][idx] = iso;
        day.tasks.push({id:e.nativeKey, kind:'item', itemNum:e.itemNum, mode:e.mode, idx, phase, overridden:e.overridden, originalItemNum:e.originalItemNum});
      }
      counters[phase]++;
    } else if(!weekend && (phase==='S1'||phase==='S2')){
      day.tasks = [];
    } else if(weekend){
      day.tasks = [];
      if(currentStudentYear() >= 5){
        day.tasks.push({id:'lca', kind:'generic', label:"LCA — 2 articles minimum (méthodologie + analyse critique)"});
      }
      day.tasks.push({id:'free', kind:'generic', label:"Révision libre — item ou matière de ton choix (rattrapage)"});
    } else { // CONSOL
      day.tasks = reported ? [] : [
        {id:'anki_all', kind:'generic', label:"Anki — session complète (aucune nouvelle carte)"},
        {id:'qcm_blancs', kind:'generic', label:"QCM blancs / annales chronométrées, conditions d'examen"},
        {id:'flash', kind:'generic', label:"Relecture flash — points faibles identifiés"},
        {id:'rest', kind:'generic', label:"Repos actif — vraie coupure en fin de semaine"},
      ];
    }
    days.push(day);
    cur = addDays(cur,1);
  }
  PHASE_FINAL_QUOTA.S1 = counters.S1 * ITEMS_PER_DAY.S1;
  PHASE_FINAL_QUOTA.S2 = counters.S2 * ITEMS_PER_DAY.S2;
  return days;
}

function findDay(iso){ return CAL.find(d=>d.iso===iso); }

// ---------- item overrides (échange manuel d'un item pour une case donnée) ----------
// DATA.itemOverrides est une map "clé native de la case" -> { itemNum: <item affiché à la place> }
// la clé native (ex "S1_i60_o1") identifie la case indépendamment du contenu affiché, donc
// le suivi "fait / pas fait" continue de porter sur la case, pas sur l'item.
function effectiveItemFor(phase, idx){
  const t = taskForIndex(phase, idx);
  const ov = DATA && DATA.itemOverrides && DATA.itemOverrides[t.key];
  return {
    nativeKey: t.key,
    mode: t.mode,
    itemNum: ov ? ov.itemNum : t.itemNum,
    overridden: !!ov,
    originalItemNum: t.itemNum
  };
}
function getSlot(phase, idx){
  const e = effectiveItemFor(phase, idx);
  return Object.assign({ phase, idx, iso: (INDEX_DATE[phase] && INDEX_DATE[phase][idx]) || null }, e);
}
function findSwapCandidates(itemNum){
  const out = [];
  ['S1','S2'].forEach(phase=>{
    const cap = PHASE_FINAL_QUOTA[phase] || 0;
    for(let idx=0; idx<cap; idx++){
      const s = getSlot(phase, idx);
      if(s.itemNum === itemNum) out.push(s);
    }
  });
  out.sort((a,b)=> (a.iso||'') < (b.iso||'') ? -1 : 1);
  return out;
}
function performSwap(phaseA, idxA, nativeKeyA, itemA, slotB, itemB){
  DATA.itemOverrides = DATA.itemOverrides || {};
  DATA.itemOverrides[nativeKeyA] = { itemNum: itemB };
  DATA.itemOverrides[slotB.nativeKey] = { itemNum: itemA };
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  saveData();
  render();
}
function undoSwap(nativeKey){
  if(DATA.itemOverrides) delete DATA.itemOverrides[nativeKey];
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  saveData();
  render();
}

// ---------- fichier de secours (File System Access API) ----------
// localStorage seul n'est pas fiable dans certains cas (Arc/Chromium, fenêtres
// privées, nettoyage automatique des données au quitter). On propose donc de
// lier un vrai fichier .json sur le disque : chaque sauvegarde y est aussi
// écrite, et au chargement on relit ce fichier en priorité s'il est accessible.
const IDB_NAME = 'edn-planner-fs', IDB_STORE = 'handles', IDB_KEY = 'backupFile';
function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSetHandle(handle){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGetHandle(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const r = tx.objectStore(IDB_STORE).get(IDB_KEY);
    r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
  });
}
let backupHandle = null;
function fsApiSupported(){ return typeof window.showSaveFilePicker === 'function'; }
function setLinkStatus(text){ const el = document.getElementById('linkFileStatus'); if(el) el.textContent = text; }
async function linkBackupFile(){
  if(!fsApiSupported()){
    alert("Ton navigateur ne supporte pas cette fonction. Continue avec Exporter/Importer manuellement, ou utilise Chrome/Arc/Edge à jour.");
    return;
  }
  try{
    let handle;
    try{
      handle = await window.showSaveFilePicker({
        suggestedName: 'edn-sauvegarde.json',
        types: [{description:'Sauvegarde EDN', accept:{'application/json':['.json']}}]
      });
    }catch(e){ return; } // annulé par l'utilisateur
    backupHandle = handle;
    await idbSetHandle(handle);
    await writeBackupFile();
    setLinkStatus('Lié : ' + handle.name);
  }catch(e){ console.error(e); alert("Impossible de lier le fichier."); }
}
async function writeBackupFile(){
  if(!backupHandle) return;
  try{
    const ok = await ensurePermission(backupHandle);
    if(!ok) return;
    const writable = await backupHandle.createWritable();
    await writable.write(JSON.stringify(DATA, null, 2));
    await writable.close();
  }catch(e){ console.error('Erreur écriture fichier de secours', e); }
}
async function ensurePermission(handle){
  const opts = {mode:'readwrite'};
  if((await handle.queryPermission(opts)) === 'granted') return true;
  if((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}
async function tryReconnectBackupFile(){
  if(!fsApiSupported()) return;
  try{
    const handle = await idbGetHandle();
    if(!handle) return;
    const ok = await ensurePermission(handle);
    if(!ok){ setLinkStatus('Fichier lié : clique pour réautoriser'); backupHandle = handle; return; }
    backupHandle = handle;
    setLinkStatus('Lié : ' + handle.name);
    // Le fichier sur disque est la source la plus fiable : on le relit et,
    // s'il est plus complet que ce qu'on a en mémoire/localStorage, on l'utilise.
    const file = await handle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const parsed = JSON.parse(text);
      DATA = Object.assign({config:Object.assign({},DEFAULT_CONFIG), itemChecks:{}, checks:{}, reportedDays:{}, darkMode:false, itemOverrides:{}, customTasks:{}, subjectDeadlines:{}, onboarded:true}, parsed);
      if(!DATA.items) DATA.items = ITEMS_RAW.map(([n,t,c])=>[n,t,c]);
      await saveData();
    }
  }catch(e){ console.error('Reconnexion fichier de secours impossible', e); }
}

// ---------- synchronisation GitHub ----------
const GH_CONFIG_KEY = 'edn-planner-github-v1';
let ghSaveInFlight = false;
let ghSavePending = false;
let ghSha = null; // sha du dernier contenu connu du fichier distant

function getGithubConfig(){
  try{
    const raw = localStorage.getItem(GH_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setGithubConfig(cfg){
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
  ghSha = null;
}
function clearGithubConfig(){
  localStorage.removeItem(GH_CONFIG_KEY);
  ghSha = null;
}
function ghHeaders(cfg){
  return {
    'Authorization': 'token ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function ghContentsUrl(cfg){
  return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
}
function setGithubStatus(text){
  const el = document.getElementById('ghStatus');
  if(el) el.textContent = text;
}
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}
// tentative de chargement des données distantes au démarrage — retourne les données ou null
async function githubLoadData(){
  const cfg = getGithubConfig();
  if(!cfg || !cfg.token || !cfg.owner || !cfg.repo) return null;
  try{
    setGithubStatus('Chargement depuis GitHub…');
    const res = await fetch(ghContentsUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch||'main'), { headers: ghHeaders(cfg) });
    if(res.status===404){ setGithubStatus('Aucune donnée distante — première sauvegarde à venir'); return null; }
    if(!res.ok){ setGithubStatus('Erreur de connexion GitHub (' + res.status + ')'); return null; }
    const j = await res.json();
    ghSha = j.sha;
    const parsed = JSON.parse(b64DecodeUtf8(j.content.replace(/\n/g,'')));
    setGithubStatus('Synchronisé ✓');
    return parsed;
  }catch(e){
    console.error('Erreur GitHub (chargement)', e);
    setGithubStatus('Hors ligne — utilisation de la copie locale');
    return null;
  }
}
// sauvegarde immédiate, sérialisée : un seul push à la fois, le plus récent état gagne
async function githubQueueSave(){
  const cfg = getGithubConfig();
  if(!cfg || !cfg.token || !cfg.owner || !cfg.repo) return;
  if(ghSaveInFlight){ ghSavePending = true; return; }
  ghSaveInFlight = true;
  setGithubStatus('Sauvegarde…');
  try{
    if(ghSha === null){
      try{
        const r = await fetch(ghContentsUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch||'main'), { headers: ghHeaders(cfg) });
        if(r.ok){ const j = await r.json(); ghSha = j.sha; }
        else if(r.status===404){ ghSha = undefined; }
      }catch(e){ /* on tentera quand même l'écriture */ }
    }
    const body = {
      message: 'Mise à jour planning — ' + new Date().toISOString(),
      content: b64EncodeUtf8(JSON.stringify(DATA, null, 2)),
      branch: cfg.branch || 'main'
    };
    if(ghSha) body.sha = ghSha;
    const res = await fetch(ghContentsUrl(cfg), { method:'PUT', headers: ghHeaders(cfg), body: JSON.stringify(body) });
    if(res.ok){
      const j = await res.json();
      ghSha = j.content ? j.content.sha : null;
      setGithubStatus('Synchronisé ✓ ' + new Date().toLocaleTimeString('fr-FR'));
    } else if(res.status===409){
      ghSha = null; // conflit de version — on relira le sha au prochain essai
      setGithubStatus('Conflit de version — nouvel essai…');
      ghSavePending = true;
    } else {
      const errTxt = await res.text().catch(()=> '');
      console.error('Erreur GitHub (sauvegarde)', res.status, errTxt);
      setGithubStatus('Erreur de sauvegarde GitHub (' + res.status + ')');
    }
  }catch(e){
    console.error('Erreur GitHub (réseau)', e);
    setGithubStatus('Hors ligne — sauvegardé localement seulement');
  }finally{
    ghSaveInFlight = false;
    if(ghSavePending){
      ghSavePending = false;
      githubQueueSave();
    }
  }
}

function dayChecks(iso){ if(!DATA.checks[iso]) DATA.checks[iso] = {}; return DATA.checks[iso]; }
function isItemTaskDone(key){ return !!DATA.itemChecks[key]; }
function setItemTaskDone(key, val){ DATA.itemChecks[key] = val; saveData(); }
function isGenericDone(iso, taskId){ return !!dayChecks(iso)[taskId]; }
function setGenericDone(iso, taskId, val){ dayChecks(iso)[taskId] = val; saveData(); }

function phaseColor(phase){ return phase==='S1' ? 'var(--accent)' : phase==='S2' ? 'var(--navy)' : 'var(--amber)'; }
function phaseLabel(phase){ return phase==='S1' ? 'Semestre 1 — découverte + révision' : phase==='S2' ? 'Semestre 2 — révision pure' : 'Consolidation finale'; }

// ---------- dynamic quota helpers ----------
function quotaBeforeToday(phase){
  const t = todayDate();
  if(CAL.length && t < CAL[0].date) return 0;
  if(CAL.length && t > CAL[CAL.length-1].date) return PHASE_FINAL_QUOTA[phase];
  const today = findDay(todayIso());
  if(!today) return PHASE_FINAL_QUOTA[phase];
  if(today.phase === phase){
    // count completed weekdays strictly before today in this phase
    let n = 0;
    for(const d of CAL){
      if(d.iso === today.iso) break;
      if(!d.weekend && d.phase===phase && !d.reported) n++;
    }
    return n * ITEMS_PER_DAY[phase];
  }
  const order = {S1:0, S2:1, CONSOL:2};
  if(order[today.phase] > order[phase]) return PHASE_FINAL_QUOTA[phase];
  return 0;
}
function quotaThroughToday(phase){
  const t = todayDate();
  if(CAL.length && t < CAL[0].date) return 0;
  if(CAL.length && t > CAL[CAL.length-1].date) return PHASE_FINAL_QUOTA[phase];
  const today = findDay(todayIso());
  if(!today) return PHASE_FINAL_QUOTA[phase];
  if(today.phase === phase){
    if(today.reported) return quotaBeforeToday(phase);
    let n = 0;
    for(const d of CAL){
      if(!d.weekend && d.phase===phase && !d.reported) n++;
      if(d.iso === today.iso) break;
    }
    return n * ITEMS_PER_DAY[phase];
  }
  const order = {S1:0, S2:1, CONSOL:2};
  if(order[today.phase] > order[phase]) return PHASE_FINAL_QUOTA[phase];
  return 0;
}

// collect uncompleted task refs in [0, cap) for a phase, in order
function uncompletedInRange(phase, cap){
  const out = [];
  for(let idx=0; idx<cap; idx++){
    const s = getSlot(phase, idx);
    if(!isItemTaskDone(s.nativeKey)) out.push({ key:s.nativeKey, itemNum:s.itemNum, mode:s.mode, phase, idx, overridden:s.overridden, originalItemNum:s.originalItemNum });
  }
  return out;
}

function todaysDynamicTasks(){
  const today = findDay(todayIso());
  if(!today || today.weekend || today.phase==='CONSOL' || today.reported) return [];
  const perDay = ITEMS_PER_DAY[today.phase];
  const cap = quotaThroughToday(today.phase);
  const pending = uncompletedInRange(today.phase, cap);
  return pending.slice(0, perDay);
}

function retardList(){
  const out = [];
  ['S1','S2'].forEach(phase=>{
    const cap = quotaBeforeToday(phase);
    uncompletedInRange(phase, cap).forEach(t=>{
      out.push({ type:'item', phase, idx:t.idx, itemNum:t.itemNum, mode:t.mode, key:t.key, iso: INDEX_DATE[phase][t.idx] });
    });
  });
  // generic (weekend/consol) tasks from past days, not done
  const today = todayIso();
  CAL.forEach(d=>{
    if(d.iso >= today) return;
    if(d.weekend || d.phase==='CONSOL'){
      (d.tasks||[]).forEach(t=>{
        if(t.kind==='generic' && !isGenericDone(d.iso, t.id)){
          out.push({type:'generic', iso:d.iso, label:t.label, taskId:t.id});
        }
      });
    }
  });
  out.sort((a,b)=> (a.iso||'') < (b.iso||'') ? -1 : 1);
  return out;
}

// ---------- item history ----------
// Parcourt les cases "effectives" (après échanges éventuels) : une case échangée vers cet
// item apparaît dans son historique, une case échangée vers un autre item en disparaît.
function itemHistory(itemNum){
  const entries = [];
  ['S1','S2'].forEach(phase=>{
    const cap = quotaThroughToday(phase);
    for(let idx=0; idx<cap; idx++){
      const s = getSlot(phase, idx);
      if(s.itemNum === itemNum){
        entries.push({ phase, idx, mode:s.mode, done:isItemTaskDone(s.nativeKey), iso: s.iso });
      }
    }
  });
  entries.sort((a,b)=> (a.iso||'') < (b.iso||'') ? -1 : 1);
  return entries;
}

  const daysLeft = Math.max(0, daysBetween(todayDate(), exam));
  let total=0, done=0;

    total += cap;
    for(let idx=0; idx<cap; idx++){ if(isItemTaskDone(taskForIndex(phase,idx).key)) done++; }

    <div class="vital"><div class="num">${day ? (day.phase==='S1'?'S1':day.phase==='S2'?'S2':'Consol.') : '—'}</div><div class="lbl">Phase actuelle</div></div>

function weekSummaryHTML(){
  const today = todayDate();
  const dow = (today.getDay()+6)%7; // Monday=0
  const monday = addDays(today, -dow);
  const sunday = addDays(monday,6);
  let total=0, done=0;
  CAL.forEach(d=>{
    if(d.date < monday || d.date > sunday) return;
    if(!d.weekend && d.phase!=='CONSOL' && d.tasks){
      d.tasks.forEach(t=>{ if(t.kind==='item'){ total++; if(isItemTaskDone(t.id)) done++; } });
    }
  });
  const satIso = toISO(addDays(monday,5));
  const sunIso = toISO(sunday);
  const lcaOk = isGenericDone(satIso,'lca') || isGenericDone(sunIso,'lca');
  const lcaDue = sunday <= today || CAL.some(d=>d.iso===sunIso);
  return `
    <div class="week-summary">
      <p class="wtitle">Cette semaine (${fmtShort(monday)} – ${fmtShort(sunday)})</p>
      <div class="wrow"><span>Items du programme</span><span class="wval ${total>0 && done===total?'ok':''}">${done} / ${total}</span></div>
      <div class="wrow"><span>LCA du week-end</span><span class="wval ${lcaOk?'ok':'warn'}">${lcaOk?'Faite ✓':'Pas encore faite'}</span></div>
    </div>
  `;
}

function renderToday(){
  const container = document.getElementById('app');
  const start = parseISO(DATA.config.start);
  const exam = parseISO(DATA.config.exam);
  const today = todayDate();

  if(today < start){
    const d = daysBetween(today, start);
    container.innerHTML = `<div class="empty-state"><h2>Le programme démarre bientôt</h2><p>Ton dossier commence le ${fmtShort(start)} — encore ${d} jour${d>1?'s':''}.</p></div>`;
    return;
  }
  if(today > exam){
    container.innerHTML = `<div class="empty-state"><h2>Bonne chance pour les EDN !</h2><p>Le programme prévu est terminé.</p></div>`;
    return;
  }
  const day = findDay(todayIso());
  if(!day){ container.innerHTML = `<div class="empty-state"><p>Jour hors plage.</p></div>`; return; }

  const color = phaseColor(day.phase);
  let head = `
    <div class="day-head">
      <div class="stripe" style="background:${color}"></div>
      <p class="phase-lbl" style="color:${color}">${phaseLabel(day.phase)}</p>
      <h2>${fmtLong(day.date)}</h2>
      <p class="sub">${day.reported ? "Journée reportée — rien de nouveau aujourd'hui" : day.weekend ? 'Week-end — LCA obligatoire' : (day.phase==='CONSOL' ? 'Pas de contenu nouveau' : '')}</p>
      ${(!day.weekend && (day.phase==='S1'||day.phase==='S2')) ? `<button class="report-btn ${day.reported?'active':''}" id="reportBtn">${day.reported ? '↺ Annuler le report' : '⤼ Reporter cette journée'}</button>` : ''}
    </div>
  `;

  let body = '';
  if(day.weekend || day.phase==='CONSOL'){
    body = day.reported ? `<p class="empty-state">Journée reportée.</p>` : genericListHTML(day.iso, day.tasks);
  } else if(day.reported){
    body = `<p class="empty-state">Journée reportée — les items prévus glissent automatiquement aux jours suivants.</p>`;
  } else {
    const tasks = todaysDynamicTasks();
    if(tasks.length===0){
      body = `<div class="empty-state"><p>Aucun item en attente pour aujourd'hui — tu es à jour !</p></div>`;
    } else {
      body = tasks.map(t => itemTaskHTML(t)).join('');
    }
  }

  const custom = day.reported ? '' : customTasksHTML(day.iso);

  container.innerHTML = weekSummaryHTML() + head + body + custom + `<footer class="note">Plus de temps aujourd'hui ? Avance librement (onglet Planning). Moins de temps ? Utilise "Reporter cette journée", ou laisse simplement les items non faits — ils remonteront automatiquement demain.</footer>`;
  bindTaskHandlers(container);
  if(!day.reported) bindCustomTaskHandlers(container, day.iso);
  const rb = document.getElementById('reportBtn');
  if(rb) rb.addEventListener('click', ()=>{
    if(!DATA.reportedDays) DATA.reportedDays = {};
    if(day.reported) delete DATA.reportedDays[day.iso];
    else DATA.reportedDays[day.iso] = true;
    CAL = buildCalendar(DATA.config, DATA.reportedDays);
    saveData();
    render();
  });
}

function renderProgress(){
  const container = document.getElementById('app');
  if(selectedItemNum){ renderItemHistory(selectedItemNum); return; }

  const status = {};
  ['S1','S2'].forEach(phase=>{
    const cap = quotaThroughToday(phase);
    for(let idx=0; idx<cap; idx++){
      const s = getSlot(phase, idx);
      if(!status[s.itemNum]) status[s.itemNum] = {revision:false, entrainement:false};
      if(isItemTaskDone(s.nativeKey)){
        if(s.mode==='revision') status[s.itemNum].revision = true;
        else status[s.itemNum].entrainement = true;
      }
    }
  });

  function cardFor(cat){
    const nums = itemsOfCat(cat);
    let rev=0, ent=0;
    nums.forEach(n=>{ const s=status[n]; if(s){ if(s.revision) rev++; if(s.entrainement) ent++; } });
    const total = nums.length;
    const revPct = total? Math.round(rev/total*100):0;
    const entPct = total? Math.round(ent/total*100):0;
    const dl = DATA.subjectDeadlines && DATA.subjectDeadlines[cat];
    const dlLabel = dl ? ` · DL ${fmtShort(parseISO(dl))}` : '';
    return `<div class="spec-card" data-cat="${cat}">
      <div class="row1"><span class="name">${CAT_LABELS[cat]}${dlLabel}</span><span class="pct">${rev}/${total} vus · ${ent}/${total} entraînés</span></div>
      <div class="dualbar"><div class="seg-rev" style="width:${revPct}%"></div><div class="seg-ent" style="width:${Math.max(0,entPct-revPct)}%"></div></div>
    </div>`;
  }
  let html = `<p class="section-title">Matières à découvrir (période actuelle)</p>`;
  currentNewCats().forEach(c=>{ html += cardFor(c); });
  html += `<p class="section-title">Autres collèges (révision)</p>`;
  currentReviewCats().forEach(c=>{ html += cardFor(c); });
  html += `<p style="font-size:11px;color:var(--ink-soft);margin:14px 0;">Teal = items lus au moins une fois · ambre = items entraînés au moins une fois. Clique une matière pour voir le détail par item.</p>`;
  container.innerHTML = html;
  container.querySelectorAll('.spec-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const cat = card.getAttribute('data-cat');
      renderCatDetail(cat);
    });
  });
}

function renderCatDetail(cat){

function renderLCA(){
  const container = document.getElementById('app');
  const today = todayDate();
  const allSaturdays = CAL.filter(d => d.date.getDay()===6);
  const pastSaturdays = allSaturdays.filter(d=>d.date <= today).reverse();

  let streak = 0;
  for(const sat of pastSaturdays){
    const sunIso = toISO(addDays(sat.date,1));
    if(isGenericDone(sat.iso,'lca') || isGenericDone(sunIso,'lca')) streak++; else break;
  }

  let rows = '';
  allSaturdays.slice().reverse().forEach(sat=>{
    const sunDate = addDays(sat.date,1);
    const sunIso = toISO(sunDate);
    const done = isGenericDone(sat.iso,'lca') || isGenericDone(sunIso,'lca');
    rows += `<div class="lca-row ${done?'done':''}">
      <span>${fmtShort(sat.date)} – ${fmtShort(sunDate)}</span>
      <input type="checkbox" data-sat="${sat.iso}" data-sun="${sunIso}" ${done?'checked':''}>
    </div>`;
  });

  container.innerHTML = `
    <div class="lca-streak"><div class="n">${streak}</div><div class="l">week-end${streak>1?'s':''} de LCA d'affilée</div></div>
    ${rows}
  `;
  container.querySelectorAll('.lca-row input').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const sat = e.target.getAttribute('data-sat');
      const sun = e.target.getAttribute('data-sun');
      setGenericDone(sat,'lca', e.target.checked);
      setGenericDone(sun,'lca', e.target.checked);
      renderVitals();
      renderLCA();
    });
  });
}

      <div class="frow">
        <input type="text" id="newItemTitle" placeholder="Intitulé de l'item">
      </div>
      <p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 6px;">Collège(s) associé(s) :</p>
      ${catCheckboxGrid('newItem', [])}
      <button class="btn-primary" id="btnAddItem" style="margin-top:10px;">Ajouter</button>
    </div>
    <div class="frow" style="align-items:center;margin-bottom:14px;">
      <label style="font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);">Filtrer :</label>
      <select id="filterCatSelect" style="font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--white);color:var(--ink);flex:1;">
        <option value="all" ${itemsFilterCat==='all'?'selected':''}>Tous les collèges (${CURRENT_ITEMS.length})</option>
        ${cats.map(c=>`<option value="${c}" ${itemsFilterCat===c?'selected':''}>${CAT_LABELS[c]} (${itemsOfCat(c).length})</option>`).join('')}
      </select>
    </div>
    ${rows}
  `;

  document.getElementById('filterCatSelect').addEventListener('change', e=>{
    itemsFilterCat = e.target.value;
    renderItemsManager();
  });
  document.getElementById('btnAddItem').addEventListener('click', ()=>{
    const title = document.getElementById('newItemTitle').value.trim();
    const selectedCats = readCheckedCats('newItem');
    if(!title){ alert('Ajoute un intitulé avant de valider.'); return; }
    if(selectedCats.length===0){ alert('Coche au moins un collège.'); return; }
    addItem(title, selectedCats);
    render();
  });
  container.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.getAttribute('data-delete'),10);
      const item = ITEM_BY_NUM[num];
      if(confirm(`Supprimer l'item #${num} — "${item.title}" ? L'historique associé sera conservé mais ne s'affichera plus.`)){
        deleteItem(num);
        render();
      }
    });
  });
  container.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.getAttribute('data-edit'),10);
      const row = btn.closest('.item-manage-row');
      const item = ITEM_BY_NUM[num];
      row.querySelector('.imactions').innerHTML = '';
      const form = document.createElement('div');
      form.className = 'item-edit-form';
      form.innerHTML = `
        <input type="text" value="${item.title.replace(/"/g,'&quot;')}" id="editTitle-${num}">
        <p style="font-size:11.5px;color:var(--ink-soft);margin:2px 0 2px;">Collège(s) associé(s) :</p>
        ${catCheckboxGrid('editItem'+num, item.cats)}
        <div class="imactions">
          <button class="btn-primary" id="saveEdit-${num}">Enregistrer</button>
          <button class="btn-secondary" id="cancelEdit-${num}">Annuler</button>
        </div>
      `;
      row.appendChild(form);
      document.getElementById(`saveEdit-${num}`).addEventListener('click', ()=>{
        const newTitle = document.getElementById(`editTitle-${num}`).value.trim();
        const newCats = readCheckedCats('editItem'+num);
        if(!newTitle){ alert('Le titre ne peut pas être vide.'); return; }
        if(newCats.length===0){ alert('Coche au moins un collège.'); return; }
        updateItem(num, newTitle, newCats);
        render();
      });
      document.getElementById(`cancelEdit-${num}`).addEventListener('click', ()=>{ render(); });
    });
  });
}

function applyTheme(){
  document.body.classList.toggle('dark', !!DATA.darkMode);
  document.getElementById('themeToggle').textContent = DATA.darkMode ? 'Mode clair' : 'Mode sombre';
}

function renderSubjectConfigList(){
  const el = document.getElementById('subjectConfigList');
  const nc = currentNewCats();
  el.innerHTML = ALL_CATS.map(c=>{
    const dl = (DATA.subjectDeadlines && DATA.subjectDeadlines[c]) || '';
    return `<div class="subject-row">
      <label><input type="checkbox" class="newcat-check" value="${c}" ${nc.includes(c)?'checked':''}> ${CAT_LABELS[c]}</label>
      <input type="date" class="deadline-input" data-cat="${c}" value="${dl}">
    </div>`;
  }).join('');
  el.querySelectorAll('.newcat-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const checked = Array.from(el.querySelectorAll('.newcat-check:checked')).map(x=>x.value);
      DATA.config.newCats = checked;
      rebuildAll();
      CAL = buildCalendar(DATA.config, DATA.reportedDays);
      selectedDayIso = null; selectedItemNum = null;
      saveData();
      render();
    });
  });
  el.querySelectorAll('.deadline-input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      if(!DATA.subjectDeadlines) DATA.subjectDeadlines = {};
      const cat = inp.getAttribute('data-cat');
      if(inp.value) DATA.subjectDeadlines[cat] = inp.value; else delete DATA.subjectDeadlines[cat];
      rebuildAll();
      CAL = buildCalendar(DATA.config, DATA.reportedDays);
      selectedDayIso = null; selectedItemNum = null;
      saveData();
      render();
    });
  });
}

async function init(){
  DATA = await loadData();
  await tryReconnectBackupFile(); // relit le fichier de secours s'il est lié, remplace DATA si présent
  const remote = await githubLoadData(); // si GitHub est configuré, la version distante prime
  if(remote){
    DATA = Object.assign({config:Object.assign({},DEFAULT_CONFIG), itemChecks:{}, checks:{}, reportedDays:{}, darkMode:false, itemOverrides:{}, customTasks:{}, subjectDeadlines:{}, onboarded:true}, remote);
    if(!DATA.items) DATA.items = ITEMS_RAW.map(([n,t,c])=>[n,t,c]);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
  }
  if(!fsApiSupported()) setLinkStatus('Non supporté par ce navigateur');
  rebuildAll();
  CAL = buildCalendar(DATA.config, DATA.reportedDays);
  applyTheme();

  document.getElementById('cfgStart').value = DATA.config.start;
  document.getElementById('cfgS1End').value = DATA.config.s1End;
  document.getElementById('cfgExam').value = DATA.config.exam;
  document.getElementById('cfgStudentYear').value = String(currentStudentYear());
  renderSubjectConfigList();

  document.getElementById('cfgStudentYear').addEventListener('change', e=>{
    DATA.config.studentYear = parseInt(e.target.value, 10);
    CAL = buildCalendar(DATA.config, DATA.reportedDays);
    selectedDayIso = null; selectedItemNum = null;
    saveData();
    render();
  });

  const ghCfg = getGithubConfig();
  if(ghCfg){
    document.getElementById('ghOwner').value = ghCfg.owner || '';
    document.getElementById('ghRepo').value = ghCfg.repo || '';
    document.getElementById('ghPath').value = ghCfg.path || '';
    document.getElementById('ghBranch').value = ghCfg.branch || '';
    document.getElementById('ghToken').value = ghCfg.token || '';
  }
  document.getElementById('btnGhSave').addEventListener('click', async ()=>{
    const owner = document.getElementById('ghOwner').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();
    const path = document.getElementById('ghPath').value.trim() || 'data.json';
    const branch = document.getElementById('ghBranch').value.trim() || 'main';
    const token = document.getElementById('ghToken').value.trim();
    if(!owner || !repo || !token){ setGithubStatus('Renseigne au moins utilisateur, dépôt et token.'); return; }
    setGithubConfig({owner, repo, path, branch, token});
    await githubQueueSave();
  });
  document.getElementById('btnGhDisconnect').addEventListener('click', ()=>{
    clearGithubConfig();
    ['ghOwner','ghRepo','ghPath','ghBranch','ghToken'].forEach(id=>{ document.getElementById(id).value=''; });
    setGithubStatus('Déconnecté — sauvegarde locale uniquement');
  });

  document.getElementById('themeToggle').addEventListener('click', ()=>{
    DATA.darkMode = !DATA.darkMode;
    applyTheme();
    saveData();
  });
  document.getElementById('settingsToggle').addEventListener('click', ()=>{
    document.getElementById('settingsPanel').classList.toggle('open');
  });
  document.getElementById('btnExport').addEventListener('click', exportBackup);
  document.getElementById('btnLinkFile').addEventListener('click', async ()=>{
    await linkBackupFile();
    render();
  });
  document.getElementById('btnImportTrigger').addEventListener('click', ()=>{ document.getElementById('fileImport').click(); });
  document.getElementById('fileImport').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });
  ['cfgStart','cfgS1End','cfgExam'].forEach(id=>{
    document.getElementById(id).addEventListener('change', e=>{
      const map = {cfgStart:'start', cfgS1End:'s1End', cfgExam:'exam'};
      DATA.config[map[id]] = e.target.value;
      CAL = buildCalendar(DATA.config, DATA.reportedDays);
      selectedDayIso = null; selectedItemNum = null;
      saveData();
      render();
    });
  });

  document.getElementById('tabbar').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    currentTab = btn.getAttribute('data-tab');
    document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b===btn));
    if(currentTab!=='planning') selectedDayIso = null;
    if(currentTab!=='progress') selectedItemNum = null;
    render();
  });

  render();
  if(!DATA.onboarded) showOnboarding();
}

function renderOnboardSubjectList(year){
  const el = document.getElementById('obSubjectList');
  const defaults = (parseInt(year,10)===6) ? NEW_CATS_DEFAULT : [];
  el.innerHTML = ALL_CATS.map(c=>`
    <div class="subject-row">
      <label><input type="checkbox" class="ob-newcat-check" value="${c}" ${defaults.includes(c)?'checked':''}> ${CAT_LABELS[c]}</label>
    </div>
  `).join('');
}
function showOnboarding(){
  const overlay = document.getElementById('onboardOverlay');
  overlay.classList.remove('hidden');
  document.getElementById('obStudentYear').value = '6';
  renderOnboardSubjectList('6');
  document.getElementById('obStudentYear').addEventListener('change', e=>{
    renderOnboardSubjectList(e.target.value);
  });
  document.getElementById('obSubmit').addEventListener('click', ()=>{
    const year = parseInt(document.getElementById('obStudentYear').value,10);
    const start = document.getElementById('obStart').value;
    const exam = document.getElementById('obExam').value;
    const s1End = document.getElementById('obS1End').value;
    const newCats = Array.from(document.querySelectorAll('.ob-newcat-check:checked')).map(x=>x.value);
    if(!start || !exam || !s1End){ alert('Merci de renseigner les trois dates.'); return; }
    if(newCats.length===0){ alert('Coche au moins une matière nouvelle pour cette période.'); return; }
    DATA.config = Object.assign({}, DEFAULT_CONFIG, { start, exam, s1End, newCats, studentYear: year });
    DATA.onboarded = true;
    rebuildAll();
    CAL = buildCalendar(DATA.config, DATA.reportedDays);
    document.getElementById('cfgStart').value = DATA.config.start;
    document.getElementById('cfgS1End').value = DATA.config.s1End;
    document.getElementById('cfgExam').value = DATA.config.exam;
    document.getElementById('cfgStudentYear').value = String(currentStudentYear());
    renderSubjectConfigList();
    saveData();
    overlay.classList.add('hidden');
    selectedDayIso = null; selectedItemNum = null;
    render();
  });
}

init();
})();
</script>
</body>
</html>
